<script id="v78111-global-user-ordering-script">
(function(){
  const actionRe=/(request|apply|accept|decline|approve|pay|confirm|respond|book|contact|mark delivered|complete|hire|view details)/i;
  const urgentRe=/(pending|new|waiting|requested|action required|payment pending|needs approval|available|open request|owner review|admin review)/i;
  const activeRe=/(accepted|in progress|active|scheduled|processing|approved payment|assigned|confirmed)/i;
  const doneRe=/(declined|rejected|completed|delivered|paid out|closed|cancelled|rented|hired|sold|expired)/i;
  function adminView(){try{return window.currentPage==='admin'||(window.currentUser&&window.currentUser.role==='admin')}catch(e){return false}}
  function score(el){
    const text=(el.innerText||'').replace(/\s+/g,' ').trim();
    const actions=[...el.querySelectorAll('button,a.btn')].filter(x=>x.offsetParent!==null||!document.body.contains(x)).map(x=>x.innerText||'').join(' ');
    if(actionRe.test(actions)) return 400;
    if(urgentRe.test(text)) return 300;
    if(activeRe.test(text)) return 200;
    if(doneRe.test(text)) return 0;
    return 100;
  }
  function timeValue(el,index){
    const text=el.innerText||'';
    const iso=text.match(/20\d{2}[-\/]\d{1,2}[-\/]\d{1,2}(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?/g)||[];
    const us=text.match(/\d{1,2}\/\d{1,2}\/20\d{2}(?:,?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)?/ig)||[];
    const vals=[...iso,...us].map(x=>Date.parse(x)).filter(Number.isFinite);
    return vals.length?Math.max(...vals):index;
  }
  let stableSeq=0;
  function stableOrder(el){
    if(!el.dataset.v78111StableOrder) el.dataset.v78111StableOrder=String(++stableSeq);
    return Number(el.dataset.v78111StableOrder)||0;
  }
  function reorder(items,parent){
    const ranked=items.map((el,i)=>({el,i,p:score(el),t:timeValue(el,stableOrder(el)),stable:stableOrder(el)}));
    ranked.sort((a,b)=>(b.p-a.p)||(b.t-a.t)||(b.stable-a.stable));
    const desired=ranked.map(x=>x.el);
    const current=items.slice();
    const changed=desired.some((el,i)=>current[i]!==el);
    if(changed){
      const frag=document.createDocumentFragment();
      desired.forEach(el=>frag.appendChild(el));
      parent.appendChild(frag);
    }
    ranked.forEach(x=>x.el.classList.toggle('v78111-action-first',x.p>=300));
  }
  function sortTables(root){
    root.querySelectorAll('table').forEach(table=>{
      const body=table.tBodies[0]; if(!body)return;
      const rows=[...body.rows].filter(r=>!r.querySelector('th'));
      if(rows.length>1)reorder(rows,body);
    });
  }
  function sortTransactionCards(root){
    root.querySelectorAll('.grid').forEach(grid=>{
      const cards=[...grid.children].filter(x=>x.classList&&x.classList.contains('card'));
      if(cards.length<2)return;
      const transactionCards=cards.filter(c=>urgentRe.test(c.innerText||'')||activeRe.test(c.innerText||'')||doneRe.test(c.innerText||'')||actionRe.test([...c.querySelectorAll('button,a.btn')].map(x=>x.innerText||'').join(' ')));
      if(transactionCards.length<2)return;
      // Avoid reordering category/navigation menus unless most cards are actual records.
      if(transactionCards.length/cards.length<0.6)return;
      reorder(cards,grid);
    });
  }
  function apply(){
    document.body.classList.toggle('admin-mobile-view',adminView());
    if(adminView()||window.innerWidth>760)return;
    const page=document.querySelector('section:not(.hide)')||document.body;
    sortTables(page); sortTransactionCards(page);
  }
  let busy=false;
  function schedule(){if(busy)return;busy=true;requestAnimationFrame(()=>{busy=false;apply()})}
  document.addEventListener('DOMContentLoaded',schedule);window.addEventListener('resize',schedule);
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(schedule,250);setTimeout(schedule,1000);
})();
</script>

<script id="v78138-marketplace-buyer-agree">
/* V7.8.138 Marketplace buyer confirmation, desktop + phone.
   After seller accepts: listing button shows Accepted, request card shows Agree.
   After buyer agrees: status becomes Completed, admin and seller are emailed, seller contact is shown. */
(function(){
  function norm(v){return String(v||'').trim().toLowerCase();}
  function findReq(id){return (data.marketRequests||[]).find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));}
  function buyerReqForItem(m){
    if(!currentUser)return null;
    const email=cleanEmail(currentUser.email);
    return (data.marketRequests||[]).find(r=>cleanEmail(r.buyerEmail)===email&&String(r.itemId)===String(m.dbId||m.id)&&!['Cancelled','Admin Declined','Seller Declined','Connection Declined'].includes(r.status));
  }
  async function refresh(){
    persistOnly();
    try{if(typeof loadSupabaseMarketplace==='function')await loadSupabaseMarketplace();}catch(e){console.warn('Marketplace refresh skipped',e);}
    marketplace();
  }

  window.marketBuyerAgree=async function(id){
    const r=findReq(id);
    if(!r||!currentUser||cleanEmail(r.buyerEmail)!==cleanEmail(currentUser.email))return alert('Buyer only.');
    if(r.status!=='Connection Approved')return alert('The seller must accept before you can agree.');
    if(!confirm('Do you agree to buy this item from the seller?'))return;
    r.status='Completed';
    const res=await updateMarketRequestDb(r,r.status);
    if(res.error)return alert('Could not save your agreement: '+res.error.message);
    addNote(r.sellerEmail,'Buyer agreed to buy your marketplace item: '+r.itemTitle);
    addNote('admin.habeshaconnect@gmail.com','Marketplace buyer agreed after seller acceptance: '+r.itemTitle);
    try{await Promise.resolve(sendEmailNotice({to:r.sellerEmail,name:r.sellerName,subject:'Marketplace buyer agreed',summary:'The buyer agreed to buy your marketplace item.',buttonText:'Open Marketplace',page:'marketplace',details:{Buyer:r.buyerName,Item:r.itemTitle,Status:'Buyer Agreed'}}));}catch(e){console.warn('Seller agreement email failed',e);}
    try{if(typeof sendAdminEmailNotice==='function')await Promise.resolve(sendAdminEmailNotice('Marketplace buyer agreed','The buyer agreed after the seller accepted the marketplace request.',{Buyer:r.buyerName,Seller:r.sellerName,Item:r.itemTitle,Status:'Buyer Agreed'},'marketplace'));}catch(e){console.warn('Admin agreement email failed',e);}
    await refresh();
    alert('Agreed. Seller information is now available.');
  };

  window.marketCard=function(m){
    const myEmail=currentUser?cleanEmail(currentUser.email):'';
    const isOwner=currentUser&&cleanEmail(m.sellerEmail)===myEmail;
    const isAdmin=currentUser&&currentUser.role==='admin';
    const req=buyerReqForItem(m);
    const canBuy=currentUser&&!isOwner&&!isAdmin&&(m.status==='Approved'||m.status==='Available')&&!req;
    const statusClass=(m.status==='Approved'||m.status==='Available')?'good':m.status==='Declined'?'bad':'warn';
    let buyerButton='';
    if(req){
      if(req.status==='Connection Approved')buyerButton=`<button class="btn good" type="button" onclick="marketBuyerAgree('${req.id}')">Accepted — Agree</button>`;
      else if(req.status==='Completed')buyerButton=`<button class="btn good" type="button" disabled>Agreed</button>`;
      else buyerButton=`<button class="btn ghost" type="button" disabled>${req.status==='Admin Approved - Waiting Seller'?'Waiting for Seller':req.status==='Buyer Request Pending Admin'?'Request Pending Admin':req.status}</button>`;
    }
    return `<div class="card"><h3>${m.title}</h3>${marketPhotosHtml(m)}<p class="muted">${m.category||'Other'} • ${m.condition||'Good'} • ${m.city||''}</p><p><b>${money(m.price)}</b></p><p>${m.description||''}</p><p class="muted">Seller: ${m.seller||'Seller'}</p><span class="pill ${statusClass}">${m.status}</span><div class="actions">${canBuy?`<button class="btn primary" type="button" onclick="marketRequestBuy('${m.id}')">Request to Buy</button><button class="btn ghost" type="button" onclick="marketSaveItem('${m.id}')">Save Item</button>`:''}${buyerButton}${isOwner&&['Approved','Available'].includes(m.status)?`<button class="btn primary" type="button" onclick="marketMarkSold('${m.id}')">Mark Sold</button>`:''}${isAdmin&&m.status==='Pending Admin Approval'?`<button class="btn primary" type="button" onclick="marketAdminApproveListing('${m.id}')">Approve Listing</button><button class="btn danger" type="button" onclick="marketAdminDeclineListing('${m.id}')">Decline</button>`:''}${isAdmin&&m.status==='Sold Waiting Admin Verification'?`<button class="btn primary" type="button" onclick="marketAdminVerifySale('${m.id}')">Verify Sold</button>`:''}</div></div>`;
  };

  window.marketRequestCard=function(r){
    const isSeller=currentUser&&cleanEmail(r.sellerEmail)===cleanEmail(currentUser.email);

    const isAdmin=currentUser&&currentUser.role==='admin';

    const cls=['Connection Approved','Completed'].includes(r.status)?'good':String(r.status||'').includes('Declined')?'bad':'warn';
    const sellerContact=`Seller: ${String(r.sellerName||'Seller').replace(/'/g,"\\'")}\\nPhone: ${String(r.sellerPhone||'Not provided').replace(/'/g,"\\'")}\\nEmail: ${String(r.sellerEmail||'').replace(/'/g,"\\'")}`;
    const buyerContact=`Buyer: ${String(r.buyerName||'Buyer').replace(/'/g,"\\'")}\\nPhone: ${String(r.buyerPhone||'Not provided').replace(/'/g,"\\'")}\\nEmail: ${String(r.buyerEmail||'').replace(/'/g,"\\'")}`;
    return `<div class="item"><b>${r.itemTitle}</b><p>${r.buyerName} wants to buy from ${r.sellerName}</p><span class="pill ${cls}">${displayStatus}</span><div class="actions">${isAdmin&&r.status==='Buyer Request Pending Admin'?`<button class="btn primary" type="button" onclick="marketAdminApproveBuyerReq('${r.id}')">Approve Request</button><button class="btn danger" type="button" onclick="marketAdminDeclineBuyerReq('${r.id}')">Decline</button>`:''}${isSeller&&r.status==='Admin Approved - Waiting Seller'?`<button class="btn primary" type="button" onclick="marketSellerAcceptReq('${r.id}')">Accept</button><button class="btn danger" type="button" onclick="marketSellerDeclineReq('${r.id}')">Decline</button>`:''}${isBuyer&&r.status==='Connection Approved'?`<button class="btn primary" type="button" onclick="marketBuyerAgree('${r.id}')">Agree</button>`:''}${isBuyer&&r.status==='Completed'?`<button class="btn primary" type="button" onclick="alert('${sellerContact}')">View Seller Information</button>`:''}${isSeller&&r.status==='Completed'?`<button class="btn ghost" type="button" onclick="alert('${buyerContact}')">View Buyer Information</button>`:''}</div></div>`;
  };

  // Phone-friendly action layout.

  style.textContent='@media(max-width:700px){#marketplace .actions .btn{min-height:48px;width:100%;touch-action:manipulation}#marketplace .actions{display:grid;grid-template-columns:1fr;gap:9px}}';
  document.head.appendChild(style);
  window.__hcVersion='V7.8.183';
})();
</script>

<script id="v78191-trucking-agreement-contact-flow">
/* V7.8.191 — Truck job and trailer renter agreement/contact release.
   Contact details remain private until the accepted driver/renter clicks Agree. */
(function(){
  const oldOwnerActions = window.truckOwnerHomeActions;
  const oldDriverActions = window.truckDriverHomeActions;

  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function sameEmail(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();}
  function appById(id){return (data.truckApplications||[]).find(x=>String(x.id)===String(id)||String(x.dbId||'')===String(id));}
  function trailerById(id){return (data.trailerRentals||[]).find(x=>String(x.id)===String(id)||String(x.dbId||'')===String(id));}
  function jobForApp(a){return (data.truckJobs||[]).find(j=>String(j.id)===String(a?.jobId)||String(j.dbId||'')===String(a?.jobDbId||''));}
  function contactAlert(name,phone,email,label){alert(`${label}\n\nName: ${name||'Not provided'}\nPhone: ${phone||'Not provided'}\nEmail: ${email||'Not provided'}`);}

  function truckAgreementHomeCards(role){
    if(!currentUser)return '';
    const email=currentUser.email;
    let cards=[];
    if(role==='driver'){
      (data.truckApplications||[]).filter(a=>sameEmail(a.driverEmail,email)&&['Owner Accepted - Waiting Driver Agreement','Driver Agreed'].includes(a.status)).forEach(a=>{
        const j=jobForApp(a)||{};
        const agreed=a.status==='Driver Agreed';
        cards.push(`<div class="card" style="border:2px solid #16a34a"><h3>🚛 Truck Job ${agreed?'Agreed':'Accepted'}</h3><p><b>${esc(a.jobTitle||'Truck Driver Job')}</b></p><p class="muted">${agreed?'Your agreement is complete. Truck owner information is available.':'The truck owner accepted your application. Click Agree to release the owner information.'}</p><div class="actions">${agreed?`<button class="btn primary" type="button" onclick="viewTruckOwnerInformation('${esc(a.id)}')">View Owner Information</button>`:`<button class="btn good" type="button" onclick="driverAgreeTruckJob('${esc(a.id)}')">Agree</button>`}</div></div>`);
      });
      (data.trailerRentals||[]).filter(t=>sameEmail(t.renterEmail,email)&&['Owner Accepted - Waiting Renter Agreement','Renter Agreed'].includes(t.status)).forEach(t=>{
        const agreed=t.status==='Renter Agreed';
        cards.push(`<div class="card" style="border:2px solid #16a34a"><h3>🚚 Trailer Rental ${agreed?'Agreed':'Accepted'}</h3><p><b>${esc(t.trailerType||'Trailer')}</b> • ${esc(t.location||'')}</p><p class="muted">${agreed?'Your agreement is complete. Trailer owner information is available.':'The trailer owner accepted your request. Click Agree to release the trailer owner information.'}</p><div class="actions">${agreed?`<button class="btn primary" type="button" onclick="viewTrailerOwnerInformation('${esc(t.id)}')">View Trailer Owner Information</button>`:`<button class="btn good" type="button" onclick="renterAgreeTrailer('${esc(t.id)}')">Agree</button>`}</div></div>`);
      });
    }
    if(role==='truck_owner'){
      (data.trailerRentals||[]).filter(t=>sameEmail(t.renterEmail,email)&&['Owner Accepted - Waiting Renter Agreement','Renter Agreed'].includes(t.status)).forEach(t=>{
        const agreed=t.status==='Renter Agreed';
        cards.push(`<div class="card" style="border:2px solid #16a34a"><h3>🚚 Trailer Rental ${agreed?'Agreed':'Accepted'}</h3><p><b>${esc(t.trailerType||'Trailer')}</b> • ${esc(t.location||'')}</p><p class="muted">${agreed?'Your agreement is complete. Trailer owner information is available.':'The trailer owner accepted your request. Click Agree to release the trailer owner information.'}</p><div class="actions">${agreed?`<button class="btn primary" type="button" onclick="viewTrailerOwnerInformation('${esc(t.id)}')">View Trailer Owner Information</button>`:`<button class="btn good" type="button" onclick="renterAgreeTrailer('${esc(t.id)}')">Agree</button>`}</div></div>`);
      });
    }
    return cards.length?`<section class="card" style="margin-top:18px"><h2>✅ Agreement Needed / Contact Information</h2><p class="muted">Accepted trucking transactions appear here below How It Works.</p><div class="grid">${cards.join('')}</div></section>`:'';
  }

  window.truckOwnerHomeActions=function(){
    let base=typeof oldOwnerActions==='function'?oldOwnerActions():'';
    base=base.replace('</div></section>',`<div class="card"><h3>📨 See Trailer Requests for Rent</h3><p class="muted">Review requests for your posted trailers and accept or decline them.</p><button class="btn primary" onclick="goTruckSection('trailerRequests')">See Trailer Requests for Rent</button></div></div></section>`);
    return base+truckAgreementHomeCards('truck_owner');
  };
  window.truckDriverHomeActions=function(){
    return (typeof oldDriverActions==='function'?oldDriverActions():'')+truckAgreementHomeCards('driver');
  };

  const oldGoTruckSection=window.goTruckSection;
  window.goTruckSection=function(section){
    if(section==='trailerRequests'){
      show('truck');
      setTimeout(()=>{
        const el=document.getElementById('trailerRentalsTable');
        if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
      },80);
      return;
    }
    return oldGoTruckSection(section);
  };

  window.approveTruckApp=async function(id){
    const a=appById(id); if(!a)return alert('Application not found.');
    if(!currentUser||(!sameEmail(a.ownerEmail,currentUser.email)&&currentUser.role!=='admin'))return alert('Only the truck owner can accept this application.');
    if(a.status!=='Pending Owner Review')return alert('This application is not waiting for truck owner review.');
    const old={...a};
    a.status='Owner Accepted - Waiting Driver Agreement';
    a.ownerAcceptedAt=new Date().toLocaleString();
    const r=await updateTruckApplicationDb(a,{status:a.status});
    if(r&&r.error){Object.assign(a,old);return alert('Could not accept the driver application: '+r.error.message);}
    addNote(a.driverEmail,'The truck owner accepted your application. Open your home page and click Agree to receive the owner information.');
    addNote('admin.habeshaconnect@gmail.com','Truck owner accepted '+a.driverName+' for '+a.jobTitle+'. Waiting for driver agreement.');
    try{await Promise.resolve(sendEmailNotice({to:a.driverEmail,name:a.driverName,subject:'Truck owner accepted your application',summary:'The truck owner accepted your application. Open your home page and click Agree to release the owner contact information.',buttonText:'Open Home Page',page:'home',details:{Job:a.jobTitle,Owner:a.ownerName,Status:'Waiting for Your Agreement'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Truck owner accepted driver application','A truck owner accepted a driver application. The driver must now click Agree before owner contact information is released.',{Job:a.jobTitle,TruckOwner:a.ownerName,OwnerEmail:a.ownerEmail,Driver:a.driverName,DriverEmail:a.driverEmail,Status:a.status},'admin'));}catch(e){console.warn(e);}
    persistOnly();
    alert('Driver accepted. Admin and the driver were notified. The driver must now click Agree.');
    truck();
  };

  window.driverAgreeTruckJob=async function(id){
    const a=appById(id); if(!a)return alert('Application not found.');
    if(!currentUser||!sameEmail(a.driverEmail,currentUser.email))return alert('Only the accepted driver can agree.');
    if(a.status!=='Owner Accepted - Waiting Driver Agreement')return alert('This application is not waiting for your agreement.');
    const old={...a}; a.status='Driver Agreed'; a.driverAgreedAt=new Date().toLocaleString();
    const r=await updateTruckApplicationDb(a,{status:a.status});
    if(r&&r.error){Object.assign(a,old);return alert('Could not save your agreement: '+r.error.message);}
    const j=jobForApp(a)||{};
    addNote(a.ownerEmail,a.driverName+' agreed to the truck driver job.');
    try{await Promise.resolve(sendEmailNotice({to:a.ownerEmail,name:a.ownerName,subject:'Driver agreed to your truck job',summary:'The accepted driver agreed to the job. Your contact information is now available to the driver.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Job:a.jobTitle,Driver:a.driverName,DriverEmail:a.driverEmail,Status:'Driver Agreed'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Truck driver agreed','The accepted truck driver clicked Agree. Truck owner contact information was released to the driver.',{Job:a.jobTitle,Owner:a.ownerName,Driver:a.driverName,Status:'Driver Agreed'},'admin'));}catch(e){console.warn(e);}
    persistOnly();
    const ownerName=a.ownerName||j.ownerName||'Not provided';
    const ownerPhone=j.ownerPhone||a.ownerPhone||j.phone||'Not provided';
    const ownerEmail=a.ownerEmail||j.ownerEmail||'Not provided';
    contactAlert(ownerName,ownerPhone,ownerEmail,'Truck Owner Information');
    try{home();}catch(e){console.warn('Home refresh after truck driver agreement failed',e);}
  };

  window.viewTruckOwnerInformation=function(id){
    const a=appById(id);
    if(!a||!currentUser||!sameEmail(a.driverEmail,currentUser.email))return alert('Owner information is not available.');
    if(a.status!=='Driver Agreed')return alert('Please click Agree first.');
    const j=jobForApp(a)||{};
    contactAlert(a.ownerName||j.ownerName,j.ownerPhone||a.ownerPhone||j.phone,a.ownerEmail||j.ownerEmail,'Truck Owner Information');
  };

  window.approveTrailerRental=async function(id){
    const item=trailerById(id); if(!item)return alert('Trailer rental not found.');
    if(!currentUser||(!sameEmail(item.ownerEmail,currentUser.email)&&currentUser.role!=='admin'))return alert('Only the trailer owner can accept this request.');
    if(item.status!=='Pending Owner Review')return alert('This trailer request is not waiting for owner review.');
    const old={...item}; item.status='Owner Accepted - Waiting Renter Agreement'; item.ownerAcceptedAt=new Date().toLocaleString();
    const r=await updateTrailerRentalDb(item,{status:item.status});
    if(r&&r.error){Object.assign(item,old);return alert('Could not accept trailer rental: '+r.error.message);}
    addNote(item.renterEmail,'The trailer owner accepted your request. Open your home page and click Agree to receive owner information.');
    try{await Promise.resolve(sendEmailNotice({to:item.renterEmail,name:item.renterName,subject:'Trailer owner accepted your request',summary:'The trailer owner accepted your rental request. Open your home page and click Agree to release the trailer owner contact information.',buttonText:'Open Home Page',page:'home',details:{Trailer:item.trailerType,Location:item.location,Status:'Waiting for Your Agreement'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Trailer owner accepted rental request','A trailer owner accepted a rental request. The renter must now click Agree before trailer owner information is released.',{Owner:item.ownerName,OwnerEmail:item.ownerEmail,Renter:item.renterName,RenterEmail:item.renterEmail,Trailer:item.trailerType,Status:item.status},'admin'));}catch(e){console.warn(e);}
    persistOnly(); alert('Request accepted. Admin and the renter were notified. The renter must now click Agree.'); truck();
  };

  window.renterAgreeTrailer=async function(id){
    const item=trailerById(id); if(!item)return alert('Trailer rental not found.');
    if(!currentUser||!sameEmail(item.renterEmail,currentUser.email))return alert('Only the accepted renter can agree.');
    if(item.status!=='Owner Accepted - Waiting Renter Agreement')return alert('This trailer request is not waiting for your agreement.');
    const old={...item}; item.status='Renter Agreed'; item.renterAgreedAt=new Date().toLocaleString();
    const r=await updateTrailerRentalDb(item,{status:item.status});
    if(r&&r.error){Object.assign(item,old);return alert('Could not save your agreement: '+r.error.message);}
    addNote(item.ownerEmail,item.renterName+' agreed to rent your trailer.');
    try{await Promise.resolve(sendEmailNotice({to:item.ownerEmail,name:item.ownerName,subject:'Trailer renter agreed',summary:'The accepted renter agreed to rent your trailer. Your contact information is now available to the renter.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Trailer:item.trailerType,Renter:item.renterName,RenterEmail:item.renterEmail,Status:'Renter Agreed'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Trailer renter agreed','The accepted trailer renter clicked Agree. Trailer owner contact information was released.',{Trailer:item.trailerType,Owner:item.ownerName,Renter:item.renterName,Status:'Renter Agreed'},'admin'));}catch(e){console.warn(e);}
    persistOnly(); home();
    contactAlert(item.ownerName,item.ownerPhone,item.ownerEmail,'Trailer Owner Information');
  };

  window.viewTrailerOwnerInformation=function(id){
    const item=trailerById(id); if(!item||!currentUser||!sameEmail(item.renterEmail,currentUser.email)||item.status!=='Renter Agreed')return alert('Trailer owner information is not available.');
    contactAlert(item.ownerName,item.ownerPhone,item.ownerEmail,'Trailer Owner Information');
  };
})();
</script>

<script id="v78193-home-service-marketplace-final-flow">
/* V7.8.193
   1) Home Services: provider accepts, customer agrees, then both parties can view contact information.
   2) Marketplace seller listings are pinned in Admin Verification Center.
   3) Marketplace: approved listing -> customer request -> seller accept/decline -> customer Agree on Home -> seller contact release.
*/
(function(){
  const norm=v=>String(v||'').trim().toLowerCase();
  const esc=v=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const findMarketItem=id=>(data.market||[]).find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  const findMarketReq=id=>(data.marketRequests||[]).find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  async function refreshMarketV193(){persistOnly();try{if(typeof loadSupabaseMarketplace==='function')await loadSupabaseMarketplace();}catch(e){console.warn(e)} if(currentPage==='home')home();else if(currentPage==='admin')adminSuccess();else marketplace();}

  // Customer requests go directly to the seller after the listing itself has been approved by Admin.
  window.marketRequestBuy=async function(id){
    if(!requireLogin())return;
    const m=findMarketItem(id);if(!m)return alert('Marketplace item not found.');
    if(!['Approved','Available'].includes(m.status))return alert('This item is not available.');
    if(norm(m.sellerEmail)===norm(currentUser.email))return alert('You cannot request your own item.');
    const exists=(data.marketRequests||[]).find(r=>String(r.itemId)===String(m.dbId||m.id)&&norm(r.buyerEmail)===norm(currentUser.email)&&!['Cancelled','Admin Declined','Seller Declined','Connection Declined','Completed'].includes(r.status));
    if(exists)return alert('You already requested this item.');
    const r={id:'MR'+Date.now().toString().slice(-7),itemId:m.dbId||m.id,itemTitle:m.title,buyerName:currentUser.name,buyerEmail:currentUser.email,buyerPhone:currentUser.phone||'',sellerName:m.seller,sellerEmail:m.sellerEmail,sellerPhone:m.sellerPhone||'',status:'Admin Approved - Waiting Seller',createdAt:new Date().toLocaleString()};
    const res=await insertMarketRequestDb(r);if(res.error)return alert('Marketplace request was not saved: '+res.error.message);
    if(res.data){r.id=res.data.id;r.dbId=res.data.id;}
    data.marketRequests.unshift(r);
    addNote(r.sellerEmail,'New marketplace request for '+r.itemTitle+'. Please accept or decline.');
    try{await Promise.resolve(sendEmailNotice({to:r.sellerEmail,name:r.sellerName,subject:'New marketplace customer request',summary:'A customer requested your approved marketplace item. Please accept or decline the request.',buttonText:'Review Marketplace Request',page:'marketplace',details:{Item:r.itemTitle,Customer:r.buyerName,Status:'Waiting for Seller'}}));}catch(e){console.warn('Seller request email failed',e)}
    persistOnly();marketplace();alert('Request sent to the seller.');
  };

  window.marketSellerAcceptReq=async function(id){
    const r=findMarketReq(id);if(!r||!currentUser||norm(r.sellerEmail)!==norm(currentUser.email))return alert('Seller only.');
    if(r.status!=='Admin Approved - Waiting Seller')return alert('This request is not waiting for your response.');
    r.status='Connection Approved';
    const res=await updateMarketRequestDb(r,r.status);if(res.error)return alert('Could not accept the request: '+res.error.message);
    addNote(r.buyerEmail,'Seller accepted your request for '+r.itemTitle+'. Open your Home page and click Agree.');
    try{await Promise.resolve(sendEmailNotice({to:r.buyerEmail,name:r.buyerName,subject:'Marketplace seller accepted — your agreement is required',summary:'The seller accepted your marketplace request. Open your Home page and click Agree to release the seller information.',buttonText:'Open Home Page',page:'home',details:{Item:r.itemTitle,Seller:r.sellerName,Status:'Seller Accepted'}}));}catch(e){console.warn('Buyer accept email failed',e)}
    try{if(typeof sendAdminEmailNotice==='function')await Promise.resolve(sendAdminEmailNotice('Marketplace seller accepted customer request','The seller accepted the marketplace request. The customer must now click Agree.',{Item:r.itemTitle,Seller:r.sellerName,Customer:r.buyerName,Status:'Waiting for Customer Agreement'},'marketplace'));}catch(e){}
    await refreshMarketV193();alert('Accepted. The customer was notified to click Agree.');
  };

  // Put marketplace agreement/contact cards directly on the customer home page.
  const oldCustomerHomeActions=window.customerHomeActions;
  window.customerHomeActions=function(){
    let base=oldCustomerHomeActions?oldCustomerHomeActions():'';
    if(!currentUser||currentUser.role!=='customer')return base;
    const email=norm(currentUser.email);
    const agree=(data.marketRequests||[]).filter(r=>norm(r.buyerEmail)===email&&r.status==='Connection Approved');
    const complete=(data.marketRequests||[]).filter(r=>norm(r.buyerEmail)===email&&r.status==='Completed');
    let cards='';
    agree.forEach(r=>{cards+=`<div class="card" style="border:2px solid #16a34a"><h3>✅ Marketplace Seller Accepted</h3><p><b>${esc(r.itemTitle)}</b></p><p class="muted">Click Agree to confirm. Seller information stays private until you agree.</p><button class="btn primary" onclick="marketBuyerAgree('${r.id}')">Agree</button></div>`});
    complete.forEach(r=>{const msg=`Seller: ${String(r.sellerName||'Seller').replace(/'/g,"\\'")}\\nPhone: ${String(r.sellerPhone||'Not provided').replace(/'/g,"\\'")}\\nEmail: ${String(r.sellerEmail||'').replace(/'/g,"\\'")}`;cards+=`<div class="card" style="border:2px solid #16a34a"><h3>📞 Marketplace Seller Information</h3><p><b>${esc(r.itemTitle)}</b></p><button class="btn primary" onclick="alert('${msg}')">View Seller Information</button></div>`});
    return base+(cards?`<section id="marketplaceCustomerAgreementHome" style="margin-top:20px"><div class="card"><h2 style="margin:0">🛒 Marketplace Agreements</h2><p class="muted">Accepted marketplace requests requiring your action appear here.</p></div><div class="grid">${cards}</div></section>`:'');
  };

  // Home Services contact release cards. Provider acceptance is the provider's agreement;
  // the customer's Agree completes mutual agreement and unlocks both contacts.
  const oldHomeServices=window.homeServices;
  window.homeServices=function(){
    oldHomeServices();
    if(!currentUser)return;
    const email=norm(currentUser.email), root=document.getElementById('home_services');if(!root)return;
    const jobs=(data.homeServiceCustomerJobs||[]).filter(j=>j.status==='Customer Agreed'&&(norm(j.customerEmail)===email||norm(j.providerEmail)===email));
    const reqs=(data.homeServiceRequests||[]).filter(r=>r.status==='Customer Agreed'&&(norm(r.customerEmail)===email||norm(r.providerEmail)===email));
    const all=[...jobs.map(x=>({...x,_kind:'job',_title:x.title||x.category||'Home Service'})),...reqs.map(x=>({...x,_kind:'request',_title:x.serviceTitle||'Home Service'}))];
    if(!all.length)return;
    const box=document.createElement('section');box.id='homeServiceMutualContactRelease';box.style.margin='12px 0 18px';
    box.innerHTML=`<div class="card" style="border:2px solid #16a34a"><h3>✅ Both Parties Agreed — Contact Information Available</h3><p class="muted">Contact details are released only after the provider accepts and the customer clicks Agree.</p>${all.map(x=>{const isCustomer=norm(x.customerEmail)===email;const name=isCustomer?x.providerName:x.customerName;const phone=isCustomer?x.providerPhone:x.customerPhone;const mail=isCustomer?x.providerEmail:x.customerEmail;const msg=`${isCustomer?'Provider':'Customer'}: ${String(name||'Not provided').replace(/'/g,"\\'")}\\nPhone: ${String(phone||'Not provided').replace(/'/g,"\\'")}\\nEmail: ${String(mail||'Not provided').replace(/'/g,"\\'")}`;return `<div class="item"><b>${esc(x._title)}</b><p>${isCustomer?'Provider':'Customer'} information is ready.</p><button class="btn primary" onclick="alert('${msg}')">View ${isCustomer?'Provider':'Customer'} Information</button></div>`}).join('')}</div>`;
    const intro=root.querySelector('.card');if(intro&&intro.parentNode)intro.parentNode.insertBefore(box,intro.nextSibling);else root.prepend(box);
  };

  // Add pending marketplace seller listings to the top Admin Verification Center even though Marketplace uses cards, not table rows.
  const oldBuildAdminPendingQueue=window.buildAdminPendingQueue;
  window.buildAdminPendingQueue=function(){
    oldBuildAdminPendingQueue();
    const grid=document.getElementById('adminPendingQueueGrid'),badge=document.getElementById('adminPendingQueueCount');if(!grid||!badge)return;
    const pending=(data.market||[]).filter(m=>m.status==='Pending Admin Approval');
    pending.forEach(m=>{const card=document.createElement('div');card.className='adminPendingCard marketplacePendingAdminCard';card.innerHTML=`<h4>🛒 Marketplace Listing Approval</h4><div class="adminPendingField"><b>Seller</b><div>${esc(m.seller||'Seller')}<br><span class="small">${esc(m.sellerEmail||'')}</span></div></div><div class="adminPendingField"><b>Item</b><div>${esc(m.title||'Item')} • ${money(m.price||0)} • ${esc(m.city||'')}</div></div><div class="adminPendingActions"><button class="btn primary" onclick="marketAdminApproveListing('${m.id}')">Approve</button><button class="btn bad" onclick="marketAdminDeclineListing('${m.id}')">Decline</button></div>`;grid.prepend(card);});
    const total=Number(badge.textContent||0)+pending.length;badge.textContent=String(total);
    if(total&&grid.querySelector('.notice'))grid.querySelector('.notice').remove();
  };

  const style=document.createElement('style');style.textContent='@media(max-width:700px){#marketplaceCustomerAgreementHome .btn,#homeServiceMutualContactRelease .btn,.marketplacePendingAdminCard .btn{width:100%;min-height:48px;margin-top:7px}}';document.head.appendChild(style);
  window.__hcVersion='V7.8.193';
})();
</script>


<script id="v78194-job-seeker-home-agreement-contact-flow">
/* V7.8.194 — Accepted business job applications require Job Seeker agreement on Home.
   Business contact information stays private until the accepted seeker clicks Agree. */
(function(){
  const norm=v=>String(v||'').trim().toLowerCase();
  const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const findApp=id=>(data.jobApplications||[]).find(x=>String(x.id)===String(id)||String(x.dbId||'')===String(id));
  const findJob=a=>(data.jobs||[]).find(j=>String(j.id)===String(a?.jobId)||String(j.dbId||'')===String(a?.jobDbId||''))||{};
  const oldJobSeekerHomeActions=window.jobSeekerHomeActions;

  function businessContact(a){
    const j=findJob(a);
    return {
      name:a.employerName||j.employerName||j.company||'Business Owner',
      phone:j.contactPhone||a.employerPhone||'Not provided',
      email:j.contactEmail||a.employerEmail||'Not provided'
    };
  }

  window.viewAcceptedJobOwnerInformation=function(id){
    const a=findApp(id);if(!a)return alert('Application not found.');
    if(!currentUser||norm(a.applicantEmail)!==norm(currentUser.email))return alert('Only the accepted job seeker can view this information.');
    if(a.status!=='Applicant Agreed')return alert('Please click Agree first.');
    const c=businessContact(a);
    alert(`Business Owner Information\n\nName: ${c.name}\nPhone: ${c.phone}\nEmail: ${c.email}`);
  };

  window.jobSeekerHomeActions=function(){
    const base=typeof oldJobSeekerHomeActions==='function'?oldJobSeekerHomeActions():'';
    if(!currentUser||currentUser.role!=='job_seeker')return base;
    const email=norm(currentUser.email);
    const waiting=(data.jobApplications||[]).filter(a=>norm(a.applicantEmail)===email&&['Accepted','Accepted - Waiting Applicant Agreement'].includes(a.status));
    const agreed=(data.jobApplications||[]).filter(a=>norm(a.applicantEmail)===email&&a.status==='Applicant Agreed');
    let cards='';
    waiting.forEach(a=>{
      cards+=`<div class="card" style="border:2px solid #16a34a"><h3>💼 Business Accepted Your Application</h3><p><b>${esc(a.jobTitle||'Job')}</b></p><p>${esc(a.employerName||'Business')}</p><p class="muted">Click Agree to confirm. The business owner information stays private until you agree.</p><div class="actions"><button class="btn good" type="button" onclick="applicantAgreeJob('${esc(a.id)}')">Agree</button></div></div>`;
    });
    agreed.forEach(a=>{
      cards+=`<div class="card" style="border:2px solid #16a34a"><h3>📞 Business Owner Information Available</h3><p><b>${esc(a.jobTitle||'Job')}</b></p><p class="muted">You agreed to the accepted application. You may now view the business owner information.</p><div class="actions"><button class="btn primary" type="button" onclick="viewAcceptedJobOwnerInformation('${esc(a.id)}')">View Owner Information</button></div></div>`;
    });
    return base+(cards?`<section id="jobSeekerAgreementHome" style="margin-top:20px"><div class="card"><h2 style="margin:0">✅ Accepted Job Agreement</h2><p class="muted">Accepted applications requiring your agreement appear here on your home page.</p></div><div class="grid">${cards}</div></section>`:'');
  };

  const originalEmployerAccept=window.employerAcceptJobApp;
  window.employerAcceptJobApp=async function(id){
    const a=findApp(id);if(!a)return alert('Application not found.');
    if(!currentUser||norm(a.employerEmail)!==norm(currentUser.email))return alert('Only the employer can accept this application.');
    a.status='Accepted - Waiting Applicant Agreement';
    a.acceptedAt=new Date().toLocaleString();
    const res=await syncJobAppToSupabase(a);if(res.error)return alert('Could not update application: '+res.error.message);
    addNote(a.applicantEmail,'Business accepted your job application for '+a.jobTitle+'. Open your home page and click Agree to release the owner information.');
    try{await Promise.resolve(sendEmailNotice({to:a.applicantEmail,name:a.applicantName,subject:'Business accepted your job application',summary:'The business accepted your application. Open your home page and click Agree to release the business owner contact information.',buttonText:'Open Home Page',page:'home',details:{Job:a.jobTitle,Business:a.employerName,Status:'Waiting for Your Agreement'}}));}catch(e){console.warn(e)}
    try{if(typeof sendAdminEmailNotice==='function')await Promise.resolve(sendAdminEmailNotice('Business accepted job seeker application','A business owner accepted a job seeker application. The seeker must click Agree before owner contact information is released.',{Job:a.jobTitle,Business:a.employerName,Applicant:a.applicantName,ApplicantEmail:a.applicantEmail,Status:a.status},'admin'));}catch(e){console.warn(e)}
    persistOnly();
    alert('Application accepted. The job seeker and Admin were notified. The job seeker must click Agree on the home page.');
    if(currentPage==='business'&&typeof business==='function')business();else jobs();
  };

  window.applicantAgreeJob=async function(id){
    const a=findApp(id);if(!a)return alert('Application not found.');
    if(!currentUser||norm(a.applicantEmail)!==norm(currentUser.email))return alert('Only the accepted job seeker can agree.');
    if(!['Accepted','Accepted - Waiting Applicant Agreement'].includes(a.status))return alert('This application is not waiting for your agreement.');
    const old={...a};a.status='Applicant Agreed';a.applicantAgreedAt=new Date().toLocaleString();
    const res=await syncJobAppToSupabase(a);if(res.error){Object.assign(a,old);return alert('Could not save your agreement: '+res.error.message);}
    addNote(a.employerEmail,a.applicantName+' agreed to the accepted job application for '+a.jobTitle+'.');
    try{await Promise.resolve(sendEmailNotice({to:a.employerEmail,name:a.employerName,subject:'Job seeker agreed to your accepted application',summary:'The job seeker agreed after you accepted the application. Your contact information is now available to that seeker.',buttonText:'Open Jobs',page:'jobs',details:{Job:a.jobTitle,Applicant:a.applicantName,Status:'Applicant Agreed'}}));}catch(e){console.warn(e)}
    try{if(typeof sendAdminEmailNotice==='function')await Promise.resolve(sendAdminEmailNotice('Job seeker agreed to accepted job','The job seeker agreed after the business accepted the application.',{Job:a.jobTitle,Business:a.employerName,Applicant:a.applicantName,ApplicantEmail:a.applicantEmail},'admin'));}catch(e){console.warn(e)}
    persistOnly();
    const c=businessContact(a);
    alert(`Agreement completed.\n\nBusiness Owner Information\nName: ${c.name}\nPhone: ${c.phone}\nEmail: ${c.email}`);
    home();
  };

  const style=document.createElement('style');style.textContent='@media(max-width:700px){#jobSeekerAgreementHome .btn{width:100%;min-height:48px;margin-top:7px}}';document.head.appendChild(style);
  window.__hcVersion='V7.8.194';
})();
</script>

<script id="v78197-truck-owner-home-hired-cleanup">
/* V7.8.197 — Keep completed/hired driver job controls off the Truck Owner home page.
   Driver-side agreement and owner-contact access remain unchanged. */
(function(){
  const oldPersonalizedHomeItems = window.personalizedHomeItems;
  window.personalizedHomeItems = function(){
    const items = typeof oldPersonalizedHomeItems === 'function' ? oldPersonalizedHomeItems() : [];
    if(!window.currentUser || currentUser.role !== 'truck_owner') return items;
    return (items||[]).filter(item=>{
      const title=String(item?.title||'').toLowerCase();
      const status=String(item?.status||'').toLowerCase();
      if(title.includes('truck job agreed') || title.includes('view owner information')) return false;
      if(title==='my truck job' && /(filled|hired|driver agreed|completed|closed)/i.test(status)) return false;
      return true;
    });
  };

  const oldTruckOwnerHomeActions = window.truckOwnerHomeActions;
  window.truckOwnerHomeActions = function(){
    const html = typeof oldTruckOwnerHomeActions === 'function' ? oldTruckOwnerHomeActions() : '';
    if(!html) return html;
    const template=document.createElement('template');
    template.innerHTML=html;
    template.content.querySelectorAll('.card').forEach(card=>{
      const text=String(card.textContent||'').toLowerCase();
      if(text.includes('truck job agreed') || text.includes('view owner information') ||
         (text.includes('my truck job') && text.includes('open trucking'))){
        card.remove();
      }
    });
    template.content.querySelectorAll('section').forEach(section=>{
      const grid=section.querySelector('.grid');
      if(grid && !grid.querySelector('.card')) section.remove();
    });
    return template.innerHTML;
  };

  window.__hcVersion='V7.8.197';
})();
</script>

<script id="v78198-truck-driver-final-admin-approval">
/* V7.8.198 — Truck hiring completion flow.
   Owner accepts -> Driver agrees -> Admin final approves -> Hired. */
(function(){
  const norm=v=>String(v||'').trim().toLowerCase();
  const appById=id=>(data.truckApplications||[]).find(a=>String(a.id)===String(id)||String(a.dbId||'')===String(id));
  const jobForApp=a=>(data.truckJobs||[]).find(j=>String(j.id)===String(a.jobId)||String(j.dbId||'')===String(a.jobDbId));

  window.driverAgreeTruckJob=async function(id){
    const a=appById(id); if(!a)return alert('Application not found.');
    if(!currentUser||norm(a.driverEmail)!==norm(currentUser.email))return alert('Only the accepted driver can agree.');
    if(a.status!=='Owner Accepted - Waiting Driver Agreement')return alert('This application is not waiting for your agreement.');
    const old={...a};
    a.status='Pending Final Admin Approval';
    a.driverAgreedAt=new Date().toLocaleString();
    const now=new Date().toISOString();
    const r=await updateTruckApplicationDb(a,{status:a.status,approved_at:now});
    if(r&&r.error){Object.assign(a,old);return alert('Could not save your agreement: '+r.error.message);}
    const j=jobForApp(a)||{};
    addNote(a.ownerEmail,(a.driverName||'Driver')+' agreed to the truck driver job. Final admin approval is pending.');
    addNote('admin.habeshaconnect@gmail.com','Final truck hire approval needed: '+(a.driverName||'Driver')+' agreed to '+(a.jobTitle||'the job')+'.');
    try{await Promise.resolve(sendEmailNotice({to:a.ownerEmail,name:a.ownerName,subject:'Driver agreed — final admin approval pending',summary:'The accepted driver agreed to your truck job. Admin must now give final approval before the application becomes Hired.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Job:a.jobTitle,Driver:a.driverName,DriverEmail:a.driverEmail,Status:'Pending Final Admin Approval'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Final truck hire approval needed','The accepted truck driver clicked Agree. Please open Admin and select Final Approve Hire.',{Job:a.jobTitle,Owner:a.ownerName,OwnerEmail:a.ownerEmail,Driver:a.driverName,DriverEmail:a.driverEmail,Status:'Pending Final Admin Approval'},'admin'));}catch(e){console.warn(e);}
    persistOnly();
    const ownerName=a.ownerName||j.ownerName||'Not provided';
    const ownerPhone=j.ownerPhone||a.ownerPhone||j.phone||'Not provided';
    const ownerEmail=a.ownerEmail||j.ownerEmail||'Not provided';
    contactAlert(ownerName,ownerPhone,ownerEmail,'Truck Owner Information');
    try{home();}catch(e){console.warn('Home refresh after truck driver agreement failed',e);}
  };

  window.viewTruckOwnerInformation=function(id){
    const a=appById(id);
    if(!a||!currentUser||norm(a.driverEmail)!==norm(currentUser.email))return alert('Owner information is not available.');
    if(!['Pending Final Admin Approval','Hired'].includes(a.status))return alert('Please click Agree first.');
    const j=jobForApp(a)||{};
    contactAlert(a.ownerName||j.ownerName,j.ownerPhone||a.ownerPhone||j.phone,a.ownerEmail||j.ownerEmail,'Truck Owner Information');
  };

  window.approveTruckApp=async function(id){
    const a=appById(id); if(!a)return alert('Application not found.');
    const isAdmin=currentUser&&currentUser.role==='admin';
    const isOwner=currentUser&&norm(a.ownerEmail)===norm(currentUser.email);

    if(isAdmin){
      if(a.status!=='Pending Final Admin Approval')return alert('Final approval is available only after the driver clicks Agree.');
      const j=jobForApp(a);
      const oldA={...a}, oldJ=j?{...j}:null;
      const nowIso=new Date().toISOString(), nowText=new Date().toLocaleString();
      a.status='Hired'; a.hiredAt=nowText;
      if(j){j.status='Filled';j.hiredDriverName=a.driverName;j.hiredDriverEmail=a.driverEmail;j.hiredAt=nowText;}
      const others=(data.truckApplications||[]).filter(x=>String(x.jobId)===String(a.jobId)&&x.id!==a.id&&!['Declined','Closed','Hired'].includes(x.status));
      const oldOthers=others.map(x=>({x,status:x.status,closedAt:x.closedAt}));
      others.forEach(x=>{x.status='Closed';x.closedAt=nowText;});

      const r=await updateTruckApplicationDb(a,{status:'Hired',hired_at:nowIso});
      if(r&&r.error){Object.assign(a,oldA);if(j&&oldJ)Object.assign(j,oldJ);oldOthers.forEach(o=>{o.x.status=o.status;o.x.closedAt=o.closedAt;});return alert('Could not final approve the hire: '+r.error.message);}
      if(j){const jr=await updateTruckJobDb(j,{status:'Filled',hired_driver_name:a.driverName,hired_driver_email:a.driverEmail,hired_at:nowIso});if(jr&&jr.error)console.warn('Truck job filled sync failed',jr.error);}
      for(const other of others){
        const or=await updateTruckApplicationDb(other,{status:'Closed',closed_at:nowIso});
        if(or&&or.error)console.warn('Could not close another truck application',other.id,or.error);
        try{await Promise.resolve(sendEmailNotice({to:other.driverEmail,name:other.driverName,subject:'Truck job position filled',summary:'The truck owner selected another driver and the position is now filled.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Job:other.jobTitle,Status:'Closed'}}));}catch(e){console.warn(e);}
      }
      addNote(a.driverEmail,'Admin final approved your truck driving hire for '+a.jobTitle+'.');
      addNote(a.ownerEmail,'Admin final approved '+a.driverName+' as hired for '+a.jobTitle+'.');
      try{await Promise.resolve(sendEmailNotice({to:a.driverEmail,name:a.driverName,subject:'Truck job hire approved',summary:'Admin gave final approval. You are now marked Hired for this truck driving job.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Job:a.jobTitle,Owner:a.ownerName,Status:'Hired'}}));}catch(e){console.warn(e);}
      try{await Promise.resolve(sendEmailNotice({to:a.ownerEmail,name:a.ownerName,subject:'Truck driver hire approved',summary:'Admin gave final approval for your selected driver.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Driver:a.driverName,Job:a.jobTitle,Status:'Hired'}}));}catch(e){console.warn(e);}
      persistOnly();
      if(typeof adminSuccess==='function')adminSuccess(); else if(typeof admin==='function')admin();
      alert('Hire final approved. The selected driver is Hired and the other applications were closed.');
      return;
    }

    if(!isOwner)return alert('Only the truck owner can accept this application.');
    if(a.status!=='Pending Owner Review')return alert('This application is not waiting for truck owner review.');
    const old={...a};
    a.status='Owner Accepted - Waiting Driver Agreement';
    a.ownerAcceptedAt=new Date().toLocaleString();
    const r=await updateTruckApplicationDb(a,{status:a.status});
    if(r&&r.error){Object.assign(a,old);return alert('Could not accept the driver application: '+r.error.message);}
    addNote(a.driverEmail,'The truck owner accepted your application. Open your home page and click Agree.');
    addNote('admin.habeshaconnect@gmail.com','Truck owner accepted '+a.driverName+' for '+a.jobTitle+'. Waiting for driver agreement.');
    try{await Promise.resolve(sendEmailNotice({to:a.driverEmail,name:a.driverName,subject:'Truck owner accepted your application',summary:'The truck owner accepted your application. Open your home page and click Agree.',buttonText:'Open Home Page',page:'home',details:{Job:a.jobTitle,Owner:a.ownerName,Status:'Waiting for Your Agreement'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Truck owner accepted driver application','A truck owner accepted a driver application. The driver must now click Agree.',{Job:a.jobTitle,TruckOwner:a.ownerName,OwnerEmail:a.ownerEmail,Driver:a.driverName,DriverEmail:a.driverEmail,Status:a.status},'admin'));}catch(e){console.warn(e);}
    persistOnly();
    alert('Driver accepted. The driver must now click Agree.');
    truck();
  };

  const oldDriverHomeActions=window.truckDriverHomeActions;
  window.truckDriverHomeActions=function(){
    let html=typeof oldDriverHomeActions==='function'?oldDriverHomeActions():'';
    if(!currentUser||currentUser.role!=='driver')return html;
    const waiting=(data.truckApplications||[]).filter(a=>norm(a.driverEmail)===norm(currentUser.email)&&a.status==='Pending Final Admin Approval');
    if(!waiting.length)return html;
    const cards=waiting.map(a=>`<div class="card" style="border:2px solid #f59e0b"><h3>⏳ Final Admin Approval Pending</h3><p><b>${String(a.jobTitle||'Truck Driver Job')}</b></p><p class="muted">You agreed to this job. Admin must give final approval before the status becomes Hired.</p><button class="btn primary" type="button" onclick="viewTruckOwnerInformation('${String(a.id)}')">View Owner Information</button></div>`).join('');
    return html+`<section style="margin-top:18px"><div class="grid">${cards}</div></section>`;
  };

  window.__hcVersion='V7.8.198';
})();
</script>

<script id="v78199-hide-completed-truck-jobs-home">
/* V7.8.199 — Completed trucking hires stay in Trucking history, not Home activity. */
(function(){
  const previousPersonalizedHomeItems = window.personalizedHomeItems;
  window.personalizedHomeItems = function(){
    const items = typeof previousPersonalizedHomeItems === 'function' ? previousPersonalizedHomeItems() : [];
    if(!window.currentUser || !['truck_owner','driver'].includes(currentUser.role)) return items;
    const terminal = /^(filled|hired|closed|completed|declined)$/i;
    return (items||[]).filter(item=>{
      const title=String(item&&item.title||'').trim().toLowerCase();
      const status=String(item&&item.status||'').trim();
      if(currentUser.role==='truck_owner' && title==='my truck job' && terminal.test(status)) return false;
      if(currentUser.role==='driver' && title==='truck job application' && terminal.test(status)) return false;
      return true;
    });
  };
  window.__hcVersion='V7.8.199';
})();
</script>


<script id="v78203-truck-driver-agree-status-compatibility-fix">
/* V7.8.203 — Truck job Agree accepts valid legacy/current owner-accepted statuses.
   If agreement was already saved, show owner information instead of a false blocking alert. */
(function(){
  const norm=v=>String(v||'').trim().toLowerCase();
  const sameEmail=(a,b)=>norm(a)===norm(b);
  const appById=id=>(data.truckApplications||[]).find(a=>String(a.id)===String(id)||String(a.dbId||'')===String(id));
  const jobForApp=a=>(data.truckJobs||[]).find(j=>String(j.id)===String(a.jobId)||String(j.dbId||'')===String(a.jobDbId));
  const acceptedStatuses=new Set([
    'owner accepted - waiting driver agreement',
    'accepted - waiting driver agreement',
    'owner accepted',
    'accepted',
    'waiting driver agreement',
    'waiting for driver agreement'
  ]);
  const agreedStatuses=new Set(['pending final admin approval','driver agreed','hired']);

  function showOwner(a){
    const j=jobForApp(a)||{};
    const ownerName=a.ownerName||j.ownerName||'Not provided';
    const ownerPhone=j.ownerPhone||a.ownerPhone||j.phone||'Not provided';
    const ownerEmail=a.ownerEmail||j.ownerEmail||'Not provided';
    alert(`Truck Owner Information\n\nName: ${ownerName}\nPhone: ${ownerPhone}\nEmail: ${ownerEmail}`);
  }

  window.driverAgreeTruckJob=async function(id){
    const a=appById(id); if(!a)return alert('Application not found.');
    if(!currentUser||!sameEmail(a.driverEmail,currentUser.email))return alert('Only the accepted driver can agree.');
    const status=norm(a.status);

    // A prior click may already have saved the agreement. Do not show a false error.
    if(agreedStatuses.has(status)){
      showOwner(a);
      return;
    }
    if(!acceptedStatuses.has(status))return alert('The truck owner has not accepted this application yet.');

    const old={...a};
    a.status='Pending Final Admin Approval';
    a.driverAgreedAt=new Date().toLocaleString();
    const now=new Date().toISOString();
    const r=await updateTruckApplicationDb(a,{status:a.status,approved_at:now});
    if(r&&r.error){Object.assign(a,old);return alert('Could not save your agreement: '+r.error.message);}

    addNote(a.ownerEmail,(a.driverName||'Driver')+' agreed to the truck driver job. Final admin approval is pending.');
    addNote('admin.habeshaconnect@gmail.com','Final truck hire approval needed: '+(a.driverName||'Driver')+' agreed to '+(a.jobTitle||'the job')+'.');
    try{await Promise.resolve(sendEmailNotice({to:a.ownerEmail,name:a.ownerName,subject:'Driver agreed — final admin approval pending',summary:'The accepted driver agreed to your truck job. Admin must now give final approval before the application becomes Hired.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Job:a.jobTitle,Driver:a.driverName,DriverEmail:a.driverEmail,Status:'Pending Final Admin Approval'}}));}catch(e){console.warn(e);}
    try{await Promise.resolve(sendAdminEmailNotice('Final truck hire approval needed','The accepted truck driver clicked Agree. Please open Admin and select Final Approve Hire.',{Job:a.jobTitle,Owner:a.ownerName,OwnerEmail:a.ownerEmail,Driver:a.driverName,DriverEmail:a.driverEmail,Status:'Pending Final Admin Approval'},'admin'));}catch(e){console.warn(e);}
    persistOnly();
    showOwner(a);
    try{home();}catch(e){console.warn('Home refresh after truck driver agreement failed',e);}
  };

  window.__hcVersion='V7.8.204';
})();
</script>

<script id="v78200-trailer-owner-accept-decline-fix">
/* V7.8.200 — Restore trailer owner Accept/Decline controls for Pending Owner Review requests. */
(function(){
  function sameEmail(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();}
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  const previousOwnerActions=window.truckOwnerHomeActions;
  window.truckOwnerHomeActions=function(){
    let base=typeof previousOwnerActions==='function'?previousOwnerActions():'';
    if(!currentUser)return base;
    const pending=(data.trailerRentals||[]).filter(t=>sameEmail(t.ownerEmail,currentUser.email)&&t.status==='Pending Owner Review'&&t.renterEmail);
    if(!pending.length)return base;
    const cards=pending.map(t=>`<div class="card" style="border:2px solid #f59e0b"><h3>🚚 New Trailer Rental Request</h3><p><b>${esc(t.trailerType||'Trailer')}</b> • ${esc(t.location||'')}</p><p><b>Requester:</b> ${esc(t.renterName||'Truck driver/owner')}</p><p><b>Phone:</b> ${esc(t.renterPhone||'Not provided')}</p><p class="muted">Accept or decline this trailer rental request.</p><div class="actions"><button class="btn good" type="button" onclick="approveTrailerRental('${esc(t.id)}')">Accept</button><button class="btn bad" type="button" onclick="declineTrailerRental('${esc(t.id)}')">Decline</button></div></div>`).join('');
    return base+`<section class="card" style="margin-top:18px"><h2>🔔 Trailer Requests Waiting for Your Decision</h2><div class="grid">${cards}</div></section>`;
  };

  const previousTruck=window.truck;
  window.truck=function(){
    const result=previousTruck.apply(this,arguments);
    setTimeout(()=>{
      if(!currentUser||currentUser.role!=='truck_owner')return;
      const table=document.getElementById('trailerRentalsTable')?.nextElementSibling;
      if(!table)return;
      const rows=table.querySelectorAll('tbody tr, tr');
      rows.forEach(row=>{
        const text=row.textContent||'';
        if(!/Pending Owner Review/i.test(text))return;
        const cells=row.querySelectorAll('td');
        if(!cells.length)return;
        const actionCell=cells[cells.length-1];
        const item=(data.trailerRentals||[]).find(t=>sameEmail(t.ownerEmail,currentUser.email)&&t.status==='Pending Owner Review'&&text.includes(String(t.trailerType||''))&&text.includes(String(t.renterName||'')));
        if(item)actionCell.innerHTML=`<button class="btn good" type="button" onclick="approveTrailerRental('${esc(item.id)}')">Accept</button> <button class="btn bad" type="button" onclick="declineTrailerRental('${esc(item.id)}')">Decline</button>`;
      });
    },0);
    return result;
  };

  window.__hcVersion='V7.8.200';
})();
</script>

<script id="v78201-remove-agreed-transaction-buttons">
/* V7.8.202 — After the driver/renter agrees, remove all Home-page buttons
   for that specific truck job or trailer rental transaction. History remains in Trucking. */
(function(){
  const norm=v=>String(v||'').trim().toLowerCase();

  const priorItems=window.personalizedHomeItems;
  window.personalizedHomeItems=function(){

  window.truck=async function(){
    if(typeof loadSupabaseTrucking==='function')try{await loadSupabaseTrucking();}catch(e){console.warn(e);}
    const out=await priorTruck.apply(this,arguments);
    if(currentUser&&currentUser.role==='truck_owner'){
      document.querySelectorAll('#truckOwnerApplicationActions,#truckOwnerApplicationActionsV78208').forEach((el,i)=>{if(i>0)el.remove();});
      const host=document.getElementById('truck');if(host&&!document.getElementById('truckOwnerApplicationActionsV78208')){const html=ownerPanel();if(html){const intro=host.querySelector('.category-intro');if(intro)intro.insertAdjacentHTML('afterend',html);else host.insertAdjacentHTML('afterbegin',html);}}
    }
    return out;
  };
  window.__hcVersion='V7.8.209';
})();
</script>

<script id="v78210-trailer-owner-requester-agree-button-fix">
/* V7.8.210 — Targeted trailer-rental UI fix only.
   Shows the existing renter Agree action in the Trucking dashboard when a truck owner
   requests another owner's trailer and the trailer owner has accepted. */
(function(){
  function norm(v){return String(v||'').trim().toLowerCase();}
  function sameEmail(a,b){return norm(a)===norm(b);}
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function eligibleRequests(){
    if(!window.currentUser)return [];
    return (data.trailerRentals||[]).filter(t=>
      sameEmail(t.renterEmail,currentUser.email) &&
      String(t.status||'')==='Owner Accepted - Waiting Renter Agreement'
    );
  }
  function agreementPanel(){
    const rows=eligibleRequests();
    if(!rows.length)return '';
    return `<section id="trailerOwnerRequesterAgreeV78210" class="card" style="margin-top:18px;border:2px solid #16a34a">
      <h2>🚚 Trailer Owner Accepted — Agree to Continue</h2>
      <p class="muted">The trailer owner accepted your request. Click Agree to confirm and receive the trailer owner information.</p>
      <div class="grid">${rows.map(t=>`<div class="card">
        <h3>${esc(t.trailerType||'Trailer')}</h3>
        <p>${esc(t.location||'')}</p>
        <p><b>Trailer Owner:</b> ${esc(t.ownerName||'Trailer Owner')}</p>
        <button class="btn good" type="button" onclick="renterAgreeTrailer('${esc(t.id)}')">Agree</button>
      </div>`).join('')}</div>
    </section>`;
  }
  function placeAgreementPanel(){
    if(!currentUser)return;
    const host=document.getElementById('truck');
    if(!host)return;
    const existing=document.getElementById('trailerOwnerRequesterAgreeV78210');
    if(existing)existing.remove();
    const html=agreementPanel();
    if(!html)return;
    const intro=host.querySelector('.category-intro');
    if(intro)intro.insertAdjacentHTML('afterend',html);
    else host.insertAdjacentHTML('afterbegin',html);
  }
  const priorTruck=window.truck;
  window.truck=async function(){
    const out=await priorTruck.apply(this,arguments);
    placeAgreementPanel();
    return out;
  };
  window.__hcVersion='V7.8.210';
})();
</script>

<script id="v78211-taxi-limo-full-flow-audit-fix">
/* V7.8.211 — Taxi/Limo flow consolidation only.
   Keeps the current owner -> driver acceptance -> final admin approval flow active,
   normalizes Taxi/Limo identity matching, and disables the obsolete direct-hire handler. */
(function(){
  function norm(v){return String(v||'').trim().toLowerCase();}
  function sid(v){return String(v==null?'':v).trim();}
  function sameEmail(a,b){return !!norm(a)&&norm(a)===norm(b);}
  function byId(list,id){const key=sid(id);return (list||[]).find(x=>sid(x.id)===key||sid(x.dbId)===key);}
  function prepareTaxiData(){
    (data.taxiLimoOwners||[]).forEach(o=>{o.ownerEmail=norm(o.ownerEmail);o.id=sid(o.id);if(o.dbId!=null)o.dbId=sid(o.dbId);});
    (data.taxiLimoVehicles||[]).forEach(v=>{v.ownerEmail=norm(v.ownerEmail);v.id=sid(v.id);if(v.dbId!=null)v.dbId=sid(v.dbId);v.ownerId=sid(v.ownerId);});
    (data.taxiDriverApps||[]).forEach(d=>{d.email=norm(d.email);d.ownerEmail=norm(d.ownerEmail);d.id=sid(d.id);if(d.dbId!=null)d.dbId=sid(d.dbId);d.assignedVehicleId=sid(d.assignedVehicleId);});
    (data.taxiLimoDriverAssignments||[]).forEach(a=>{a.ownerEmail=norm(a.ownerEmail);a.driverEmail=norm(a.driverEmail);a.id=sid(a.id);if(a.dbId!=null)a.dbId=sid(a.dbId);a.ownerId=sid(a.ownerId);a.vehicleId=sid(a.vehicleId);});
    (data.taxiRideRequests||[]).forEach(r=>{r.riderEmail=norm(r.riderEmail);r.driverEmail=norm(r.driverEmail);r.id=sid(r.id);if(r.dbId!=null)r.dbId=sid(r.dbId);r.declinedBy=(r.declinedBy||[]).map(norm).filter(Boolean);});
  }

  const priorTaxiRenderOnly=window.taxiRenderOnly;
  window.taxiRenderOnly=function(){prepareTaxiData();return priorTaxiRenderOnly.apply(this,arguments);};

  window.findTaxiOwner=function(email){prepareTaxiData();return (data.taxiLimoOwners||[]).find(o=>sameEmail(o.ownerEmail,email));};
  window.findTaxiVehicle=function(id){prepareTaxiData();return byId(data.taxiLimoVehicles,id);};
  window.findTaxiApp=function(email){prepareTaxiData();return (data.taxiDriverApps||[]).find(a=>sameEmail(a.email,email)&&a.status==='Approved');};
  window.findTaxiRide=function(id){prepareTaxiData();return byId(data.taxiRideRequests,id);};

  window.assignTaxiDriverToVehicle=async function(){
    prepareTaxiData();
    if(!currentUser||currentUser.role!=='taxi_limo_owner')return alert('Taxi/Limo owner only.');
    const owner=findTaxiOwner(currentUser.email);
    if(!owner||owner.status!=='Approved')return alert('Admin must approve your Taxi/Limo owner application first.');
    const driverEmail=norm(document.getElementById('taxiAssignDriver')?.value);
    const vehicleId=sid(document.getElementById('taxiAssignVehicle')?.value);
    if(!driverEmail||!vehicleId)return alert('Choose an approved driver and an approved vehicle.');
    const d=(data.taxiDriverApps||[]).find(a=>sameEmail(a.email,driverEmail)&&a.status==='Approved'&&!norm(a.ownerEmail));
    const v=findTaxiVehicle(vehicleId);
    if(!d||!v)return alert('Driver or vehicle was not found.');
    if(!sameEmail(v.ownerEmail,currentUser.email)||v.status!=='Approved')return alert('Choose one of your approved Taxi/Limo vehicles.');
    const existing=(data.taxiLimoDriverAssignments||[]).find(x=>sameEmail(x.driverEmail,driverEmail)&&['Waiting Driver Acceptance','Pending Admin Approval','Approved'].includes(x.status));
    if(existing)return alert('This driver already has an active hire request or job.');
    const a={id:'TLA'+Date.now().toString().slice(-6),ownerId:owner.dbId||owner.id,ownerName:owner.ownerName,ownerEmail:norm(owner.ownerEmail),driverName:d.name,driverEmail:norm(d.email),vehicleId:v.dbId||v.id,vehicleLabel:`${v.year||''} ${v.make||''} ${v.model||''} - ${v.plate||''}`.trim(),status:'Waiting Driver Acceptance',createdAt:new Date().toLocaleString()};
    const res=await insertTaxiAssignmentDb(a);
    if(res.error)return alert('Hire request was not saved to Supabase. Please run the Taxi/Limo SQL, then try again. '+res.error.message);
    if(res.data){a.id=sid(res.data.id);a.dbId=sid(res.data.id);}
    data.taxiLimoDriverAssignments.unshift(a);
    addNote(d.email,'Taxi/Limo owner wants to hire you: '+(owner.companyName||owner.ownerName)+' / '+a.vehicleLabel);
    sendEmailNotice({to:d.email,name:d.name,subject:'Taxi/Limo owner hire request',summary:'A taxi/limo owner wants to hire you. Please accept or decline in your Taxi/Limo dashboard.',buttonText:'Open Taxi/Limo',page:'taxi',details:{Owner:owner.ownerName,Company:owner.companyName,Vehicle:a.vehicleLabel,Status:a.status}});
    persistOnly();
    fireAndForget(loadSupabaseTaxiLimo(),'taxi/limo assignment refresh');
    alert('Hire request sent to the driver. If the driver accepts, admin will approve the connection.');
    taxi();
  };

  window.taxiDriverAcceptHire=async function(id){
    prepareTaxiData();const a=byId(data.taxiLimoDriverAssignments,id);
    if(!a)return alert('Hire request not found.');
    if(!currentUser||!sameEmail(a.driverEmail,currentUser.email))return alert('Only this driver can accept the hire request.');
    if(a.status!=='Waiting Driver Acceptance')return alert('This hire request is not waiting for driver acceptance.');
    const res=await updateTaxiAssignmentDb(a,{status:'Pending Admin Approval',driver_responded_at:new Date().toISOString()});
    if(res.error)return alert('Could not accept hire request: '+res.error.message);
    a.status='Pending Admin Approval';a.driverAcceptedAt=new Date().toLocaleString();
    addNote(a.ownerEmail,'Taxi/Limo driver accepted your hire request. Waiting for admin approval: '+a.driverName);
    sendAdminEmailNotice('Taxi/Limo hire request accepted - waiting admin approval','A taxi/limo driver accepted an owner hire request. Admin approval is now required before they are connected.',{Owner:a.ownerName,OwnerEmail:a.ownerEmail,Driver:a.driverName,DriverEmail:a.driverEmail,Vehicle:a.vehicleLabel},'admin');
    persistOnly();fireAndForget(loadSupabaseTaxiLimo(),'taxi/limo hire refresh');alert('You accepted the hire request. Admin approval is now required.');taxi();
  };

  window.taxiDriverDeclineHire=async function(id){
    prepareTaxiData();const a=byId(data.taxiLimoDriverAssignments,id);
    if(!a)return alert('Hire request not found.');
    if(!currentUser||!sameEmail(a.driverEmail,currentUser.email))return alert('Only this driver can decline the hire request.');
    if(a.status!=='Waiting Driver Acceptance')return alert('This hire request is not waiting for driver acceptance.');
    const res=await updateTaxiAssignmentDb(a,{status:'Driver Declined',driver_responded_at:new Date().toISOString()});
    if(res.error)return alert('Could not decline hire request: '+res.error.message);
    a.status='Driver Declined';a.driverDeclinedAt=new Date().toLocaleString();
    addNote(a.ownerEmail,'Taxi/Limo driver declined your hire request: '+a.driverName);
    sendEmailNotice({to:a.ownerEmail,name:a.ownerName,subject:'Taxi/Limo driver declined hire request',summary:'The driver declined your hire request.',buttonText:'Open Taxi/Limo',page:'taxi',details:{Driver:a.driverName,Vehicle:a.vehicleLabel,Status:a.status}});
    persistOnly();fireAndForget(loadSupabaseTaxiLimo(),'taxi/limo hire refresh');alert('You declined the hire request.');taxi();
  };

  window.adminApproveTaxiAssignment=async function(id){
    prepareTaxiData();const a=byId(data.taxiLimoDriverAssignments,id);
    if(!a)return alert('Hire request not found.');
    if(a.status!=='Pending Admin Approval')return alert('This hire request is not waiting for final admin approval.');
    const d=(data.taxiDriverApps||[]).find(x=>sameEmail(x.email,a.driverEmail));
    if(!d)return alert('Driver profile was not found.');
    const res=await updateTaxiAssignmentDb(a,{status:'Approved',hired_at:new Date().toISOString()});
    if(res.error)return alert('Could not approve hire: '+res.error.message);
    const dr=await updateTaxiDriverDb(d,{ownerEmail:a.ownerEmail,assignedVehicleId:a.vehicleId,assignedVehicle:a.vehicleLabel,availabilityStatus:'Hired'});
    if(dr.error){await updateTaxiAssignmentDb(a,{status:'Pending Admin Approval'});return alert('Driver availability was not updated, so the hire was not completed: '+dr.error.message);}
    a.status='Approved';a.hiredAt=new Date().toLocaleString();d.ownerEmail=a.ownerEmail;d.assignedVehicleId=a.vehicleId;d.assignedVehicle=a.vehicleLabel;d.availabilityStatus='Hired';
    (data.taxiLimoDriverAssignments||[]).filter(x=>x.id!==a.id&&sameEmail(x.driverEmail,a.driverEmail)&&['Waiting Driver Acceptance','Pending Admin Approval'].includes(x.status)).forEach(x=>{x.status='Closed';fireAndForget(updateTaxiAssignmentDb(x,{status:'Closed'}),'close duplicate taxi hire request');});
    addNote(a.ownerEmail,'Taxi/Limo hire connection approved by admin: '+a.driverName);addNote(a.driverEmail,'Your Taxi/Limo hire connection was approved by admin. Vehicle: '+a.vehicleLabel);
    persistOnly();fireAndForget(loadSupabaseTaxiLimo(),'taxi/limo admin refresh');adminSuccess();
  };

  // Obsolete V7.8.71-era direct-hire entry point: keep compatibility but route it through the current request flow.
  window.ownerAssignTaxiDriver=function(driverEmail){
    prepareTaxiData();
    if(!currentUser||currentUser.role!=='taxi_limo_owner')return alert('Taxi/Limo owner only.');
    const driverSelect=document.getElementById('taxiAssignDriver');
    const vehicleSelect=document.getElementById('taxiAssignVehicle');
    if(!driverSelect||!vehicleSelect)return alert('Open Post Driver Job, choose the driver and vehicle, then send the hire request.');
    driverSelect.value=norm(driverEmail);
    return assignTaxiDriverToVehicle();
  };

  const priorLoad=window.loadSupabaseTaxiLimo;
  if(typeof priorLoad==='function')window.loadSupabaseTaxiLimo=async function(){const out=await priorLoad.apply(this,arguments);prepareTaxiData();return out;};
  prepareTaxiData();
  window.__hcVersion='V7.8.212';
})();
</script>
