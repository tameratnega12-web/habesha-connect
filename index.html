/* V7.8.69 RENTALS: restore requested flow
   Owner posts property -> Admin approves property -> Seeker requests -> Admin approves/declines request.
   Admin approval marks property Rented. Admin decline keeps/returns property Available. No seeker $10 payment. */
function rentalRequestActionButtons(q,role){
  const st=String(q.status||'Pending');
  const id=q.id||q.dbId;
  if(role==='admin'){
    if(['Pending','Pending Admin Review','Pending Owner Review','Waiting Owner Review'].includes(st)){
      return `<button class="btn primary" onclick="approveRentalReq('${id}')">Approve - Mark Rented</button> <button class="btn bad" onclick="declineRentalReq('${id}')">Decline</button>`;
    }
    return '-';
  }
  return '-';
}
function rentalRequestsTable(reqs,role){
  let wrapId=role==='owner'?' id="ownerRentalRequests"':(role==='rent_seeker'?' id="seekerRentalRequests"':'');
  return `<div${wrapId}><h3>Rental Requests / Contacts</h3><table><tr><th>Property</th><th>Rent Seeker</th><th>Phone</th><th>Owner</th><th>Owner Phone</th><th>Status</th><th>Action</th></tr>${reqs.map(q=>`<tr><td>${q.propertyTitle}</td><td>${q.seekerName}</td><td>${q.seekerPhone||''}</td><td>${q.ownerName||''}</td><td>${(q.status==='Approved'||role==='admin'||role==='owner')?(q.ownerPhone||''):'Shown after admin approval'}</td><td>${q.status}</td><td>${rentalRequestActionButtons(q,role)}</td></tr>`).join('')||'<tr><td colspan="7">No rental requests yet.</td></tr>'}</table></div>`;
}
rentalRequestsHtml=function(reqs,role,anchor){
  let wrapId=anchor?` id="${anchor}"`:(role==='owner'?' id="ownerRentalRequests"':'');
  return `<div${wrapId}><h3>Rental Requests / Contacts</h3><table><tr><th>Property</th><th>Rent Seeker</th><th>Phone</th><th>Owner</th><th>Owner Phone</th><th>Status</th><th>Action</th></tr>${reqs.map(q=>`<tr><td>${q.propertyTitle}</td><td>${q.seekerName}</td><td>${q.seekerPhone||''}</td><td>${q.ownerName||''}</td><td>${(q.status==='Approved'||role==='admin'||role==='owner')?(q.ownerPhone||''):'Shown after admin approval'}</td><td>${q.status}</td><td>${rentalRequestActionButtons(q,role)}</td></tr>`).join('')||'<tr><td colspan="7">No rental requests yet.</td></tr>'}</table></div>`;
};
async function requestViewing(id){
 if(!requireLogin())return;
 if(!authReady())return alert('Supabase is required to send rental viewing requests. Please refresh the page and log in again.');
 if(!currentUser.id)return alert('Your profile ID is missing. Please log out, log back in, and try again.');
 await loadSupabaseRentals();
 await loadSupabaseRentalRequests();
 let r=data.rentals.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
 if(!r)return alert('Rental listing not found. Please refresh and try again.');
 if(!['Approved','Available'].includes(String(r.status||'')))return alert('This property is not available for requests.');
 if(r.ownerEmail===currentUser.email||String(r.ownerId||'')===String(currentUser.id||''))return alert('You cannot request your own property.');
 let propertyKey=r.dbId||r.id;
 let existing=data.rentalRequests.find(q=>(String(q.rentalId)===String(r.id)||String(q.rentalId)===String(r.dbId)||String(q.rentalId)===String(propertyKey))&&(String(q.seekerId||'')===String(currentUser.id||'')||q.seekerEmail===currentUser.email)&&!['Declined','Cancelled'].includes(String(q.status||'')));
 if(existing){alert('You already sent a viewing request for this property.');await rentals();return;}
 let payload={property_id:propertyKey,seeker_id:currentUser.id,paid:false,amount_paid:0,status:'Pending Admin Review'};
 let res=await hcSupabase.from('rental_requests').insert(payload).select('*').single();
 if(res.error){
   let msg=String(res.error.message||'').toLowerCase();
   if(msg.includes('amount_paid')){delete payload.amount_paid;res=await hcSupabase.from('rental_requests').insert(payload).select('*').single();}
   if(res.error&&msg.includes('paid')){delete payload.paid;res=await hcSupabase.from('rental_requests').insert(payload).select('*').single();}
   if(res.error)return alert('Viewing request could not be saved to Supabase: '+res.error.message);
 }
 let localReq={id:res.data.id,dbId:res.data.id,rentalId:propertyKey,propertyTitle:r.title,seekerName:currentUser.name,seekerPhone:currentUser.phone||'',seekerEmail:currentUser.email,seekerId:currentUser.id||'',ownerName:r.owner,ownerPhone:r.ownerPhone||'',ownerEmail:r.ownerEmail||'',ownerId:r.ownerId||'',status:'Pending Admin Review',paymentStatus:'No payment required',paid:false,amountPaid:0,time:new Date().toLocaleString(),source:'supabase'};
 data.rentalRequests.unshift(localReq);
 addNote('admin.habeshaconnect@gmail.com','New rental viewing request for '+r.title+' from '+currentUser.name+'. Admin approval is needed.');
 sendAdminEmailNotice('Rental viewing request needs admin approval','A rent seeker requested a property viewing. Admin approval will mark the property rented.',{Seeker:currentUser.name,Email:currentUser.email,Property:r.title,Owner:r.owner,OwnerEmail:r.ownerEmail},'admin');
 addNote(currentUser.email,'Your viewing request was sent to admin for approval. No payment is required during .');
 persistOnly();
 alert('Viewing request submitted. Waiting for admin approval. No payment required.');
 await rentals();
}
function __findRentalForReqV7869(q){
  return data.rentals.find(r=>String(r.id)===String(q.rentalId)||String(r.dbId)===String(q.rentalId)||String(r.id)===String(q.propertyId)||String(r.dbId)===String(q.propertyId));
}
async function __updateRentalStatusV7869(r,status){
  if(!r)return {error:null};
  const old=r.status;
  r.status=status;
  persistOnly();
  let res={error:null};
  if(authReady()&&r.dbId)res=await hcSupabase.from('properties').update({status}).eq('id',r.dbId);
  if(res.error){r.status=old;persistOnly();}
  return res;
}
approveRentalReq=async function(id){
  if(!requireAdmin())return;
  let q=data.rentalRequests.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!q)return alert('Rental request not found.');
  if(!['Pending','Pending Admin Review','Pending Owner Review','Waiting Owner Review'].includes(String(q.status||'')))return alert('This rental request is not waiting for admin approval.');
  let rental=__findRentalForReqV7869(q);
  let oldQ=q.status;
  q.status='Approved'; q.paymentStatus='No payment required'; q.paid=false; q.amountPaid=0;
  persistOnly();
  let reqRes={error:null};
  if(authReady()&&q.dbId)reqRes=await hcSupabase.from('rental_requests').update({status:'Approved',paid:false,amount_paid:0}).eq('id',q.dbId);
  if(reqRes.error){q.status=oldQ;persistOnly();return alert('Could not approve rental request: '+reqRes.error.message);}
  let propRes=await __updateRentalStatusV7869(rental,'Rented');
  if(propRes.error)return alert('Request approved, but property could not be marked Rented in Supabase: '+propRes.error.message);
  // Cancel other unfinished requests for this property so seekers do not continue requesting a rented property.
  let propertyKey=String((rental&&rental.dbId)||q.rentalId||'');
  (data.rentalRequests||[]).forEach(other=>{
    if(other!==q && String(other.rentalId)===propertyKey && !['Approved','Declined','Cancelled'].includes(String(other.status||''))){other.status='Cancelled';}
  });
  addNote(q.seekerEmail,'Congratulations! Admin approved your rental request and the property is now marked Rented. Open your home page and click Request Owner Information to release the owner contact details.');
  addNote(q.ownerEmail,'Admin approved a rental request for your property. The property is now marked Rented.');
  sendEmailNotice({to:q.seekerEmail,name:q.seekerName,subject:'Congratulations — your rental was approved',summary:'Congratulations! Admin approved your rental request and the property is now marked rented. Open your home page and click Request Owner Information to release the owner contact details.',buttonText:'Open Home Page',page:'home',details:{Property:q.propertyTitle,Status:'Approved / Rented'}});
  persistOnly();
  if(currentPage==='admin')adminSuccess('Rental request approved. Property marked Rented.'); else await rentals();
};
declineRentalReq=async function(id){
  if(!requireAdmin())return;
  let q=data.rentalRequests.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!q)return alert('Rental request not found.');
  let rental=__findRentalForReqV7869(q);
  let oldQ=q.status;
  q.status='Declined'; q.paymentStatus='No payment required'; q.paid=false; q.amountPaid=0;
  persistOnly();
  let reqRes={error:null};
  if(authReady()&&q.dbId)reqRes=await hcSupabase.from('rental_requests').update({status:'Declined',paid:false,amount_paid:0}).eq('id',q.dbId);
  if(reqRes.error){q.status=oldQ;persistOnly();return alert('Could not decline rental request: '+reqRes.error.message);}
  // If this request did not rent the property, keep/return property Available.
  if(rental && String(rental.status||'')!=='Rented'){
    let propRes=await __updateRentalStatusV7869(rental,'Available');
    if(propRes.error)return alert('Request declined, but property could not be returned to Available: '+propRes.error.message);
  }
  addNote(q.seekerEmail,'Admin declined your rental request. No payment was required.');
  addNote(q.ownerEmail,'Admin declined a rental request for your property. The property remains available.');
  sendEmailNotice({to:q.seekerEmail,name:q.seekerName,subject:'Rental request declined',summary:'Admin declined your rental request. The property remains available.',buttonText:'Open Rentals',page:'rentals',details:{Property:q.propertyTitle,Status:'Declined'}});
  persistOnly();
  if(currentPage==='admin')adminSuccess('Rental request declined. Property remains Available.'); else await rentals();
};
async function adminApproveRentalReq(id){return approveRentalReq(id);}
async function adminDeclineRentalReq(id){return declineRentalReq(id);}
async function adminFinalApproveRentalReq(id){return alert('Final admin approval was removed from Rentals. Admin approval of the seeker request is the final step and marks the property Rented.');}
async function ownerAcceptRentalReq(id){return alert('Owner accept/decline was removed from the Rental flow. Admin approves or declines the seeker request.');}
async function ownerDeclineRentalReq(id){return alert('Owner accept/decline was removed from the Rental flow. Admin approves or declines the seeker request.');}

</script>

<script>

const hcSupabase=(window.supabase&&window.SUPABASE_URL&&window.SUPABASE_ANON_KEY)?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;

const ROLE_INFO={traveler:{icon:'✈️',title:'Traveler',desc:'Post trips and accept sender package requests.'},sender:{icon:'📦',title:'Sender',desc:'Find travelers and request package space.'},owner:{icon:'🏠',title:'Property Owner',desc:'Post and manage rental properties.'},rent_seeker:{icon:'🔍',title:'Rent Seeker',desc:'Search rentals and request viewings.'},truck_owner:{icon:'🚛',title:'Truck Owner',desc:'Post trucks, hire drivers, track records, and manage loads.'},driver:{icon:'🚚',title:'Truck Driver',desc:'Manage trucking jobs and deliveries.'},business_owner:{icon:'🏢',title:'Business Owner',desc:'Create a business profile so customers can find what you serve.'},marketplace:{icon:'🛒',title:'Marketplace',desc:'Buy, sell, post items, browse items, and manage marketplace requests.'},employer:{icon:'💼',title:'Employer',desc:'Post jobs from Business Directory and review approved posts.'},job_seeker:{icon:'🔎',title:'Job Seeker',desc:'Browse approved jobs and contact businesses directly.'},event_organizer:{icon:'📅',title:'Events Organizer',desc:'Create community, church, concert, festival, business, charity, family, and sports events.'},service_provider:{icon:'🛠️',title:'Home Service Provider',desc:'Post home services and manage customer requests.'},taxi_limo_owner:{icon:'🚕',title:'Taxi/Limo Owner',desc:'Manage taxi/limo vehicles, owner dashboard, and driver requests.'},taxi_limo_driver:{icon:'🚕',title:'Taxi/Limo Driver',desc:'Apply to drive for taxi/limo owners and manage approved hiring connections.'},taxi_driver:{icon:'🚕',title:'Taxi/Limo Driver',desc:'Apply to drive for taxi/limo owners and manage approved hiring connections.'},customer:{icon:'🧭',title:'Customer',desc:'Browse marketplace, taxi, job seekers, messages, and notifications.'},admin:{icon:'⚙️',title:'Admin',desc:'Manage the full platform.'}};

const HC_STORAGE_KEY='hc_v35';
function stripLargeForStorage(value){
  try{
    return JSON.parse(JSON.stringify(value,function(key,val){
      if(typeof val==='string'){
        if(val.startsWith('data:image')||val.startsWith('data:video')||val.startsWith('data:application'))return '';
        if(val.length>2000)return val.slice(0,500)+'...';
      }
      return val;
    }),function(key,val){
      if(Array.isArray(val))return val.filter(x=>x!==''&&x!==null&&x!==undefined);
      return val;
    });
  }catch(e){console.warn('Storage cleanup failed; saving minimum session only.',e);return null;}
}
function minimalStorageData(){
  return {currentUser:currentUser||null,users:(data&&data.users)||[],settings:(data&&data.settings)||Object.assign({},DEFAULT_SETTINGS),notifications:[],payments:[],messages:[],favorites:[],reviews:[],shipments:[],trips:[],rentals:[],rentalRequests:[],market:[],marketRequests:[],savedMarketItems:[],jobs:[],jobApplications:[],trucks:[],truckJobs:[],truckApplications:[],truckDriverProfiles:[],trailerRentals:[],homeServicePosts:[],homeServiceRequests:[],homeServiceCustomerJobs:[],taxiDriverApps:[],taxiRideRequests:[],shippingItems:[],taxiLimoOwners:[],taxiLimoVehicles:[],taxiLimoDriverAssignments:[],businesses:[],events:[]};
}
function safeSetHC(obj){
  try{
    let slim=stripLargeForStorage(obj)||minimalStorageData();
    localStorage.setItem(HC_STORAGE_KEY,JSON.stringify(slim));
    return true;
  }catch(e){
    console.warn('Browser storage was full. Saving only small login/session data so buttons keep working.',e);
    try{localStorage.removeItem(HC_STORAGE_KEY);localStorage.setItem(HC_STORAGE_KEY,JSON.stringify(minimalStorageData()));return true;}catch(e2){console.warn('Minimum storage save failed; app will continue without freezing.',e2);return false;}
  }
}
function safeLoadData(){
  try{
    let raw=localStorage.getItem(HC_STORAGE_KEY);
    if(!raw)return seed();
    let parsed=JSON.parse(raw)||seed();
    return stripLargeForStorage(parsed)||seed();
  }catch(e){console.warn('Old browser storage could not be loaded; starting clean local cache.',e);try{localStorage.removeItem(HC_STORAGE_KEY);}catch(_e){}return seed();}
}

 try{Promise.resolve(promise).catch(e=>console.warn((label||'background task')+' failed',e));}catch(e){console.warn((label||'background task')+' failed',e);}
}
async function safeAsync(promise,ms,label){
 let timeout;
 try{
   return await Promise.race([
     Promise.resolve(promise),
     new Promise(resolve=>{timeout=setTimeout(()=>{console.warn((label||'Supabase task')+' timed out; continuing locally.');resolve(null);},ms||5000)})
   ]);
 }finally{if(timeout)clearTimeout(timeout);}
}

function placeCategoryTransactionsAtTop(page){
  if(!currentUser||currentUser.role==='admin')return;
  const root=$(page);
  if(!root)return;
  let intro=[...root.querySelectorAll('.notice')].find(n=>/how it works/i.test(n.textContent||''));
  if(!intro){
    const html=categoryIntro(page);
    if(html){
      const box=document.createElement('div');box.innerHTML=html;intro=box.firstElementChild;
      const h2=root.querySelector('h2');
      if(h2&&h2.nextSibling)root.insertBefore(intro,h2.nextSibling);else root.insertBefore(intro,root.firstChild);
    }
  }
  if(!intro)return;
  const ids={
    shipping:['shippingAvailableTrips','shippingItemRequests','travelerShipRequests','travelerOpenTrips'],
    rentals:['ownerRentalRequests','seekerRentalRequests','availableRentals','rentalList'],
    marketplace:['marketList'],
    jobs:['jobsList'],
    truck:['availableTruckJobs','truckApplicationsTable','trailerRentalsTable','driverProfilesTable','guestTruckJobs','guestTrailerRentals'],
    home_services:['homeServicesList','myHomeServiceRequests'],
    taxi:['taxiOpenRides','taxiAvailableJobs','taxiAvailableDrivers','taxiMyRides'],
    business:['businessList'],
    events:['upcomingEvents','eventList'],
    customer:['customerActivity','customerRequests','customerResults']
  }[page]||[];
  const nodes=[];
  ids.forEach(id=>{
    const el=root.querySelector('#'+id);
    if(!el||nodes.includes(el))return;
    const prev=el.previousElementSibling;
    if(prev&&/^H[234]$/.test(prev.tagName)&&!nodes.includes(prev))nodes.push(prev);
    nodes.push(el);
  });
  // V7.8.115: also lift any later-stage user action section (Accept, Decline, Pay, Confirm, Respond)
  // that may not have a fixed ID. This keeps the user's next required transaction under How It Works.
  const actionWords=/\b(accept|decline|pay|confirm|respond|review request|view request|complete|deliver|pick up|hire|approve)\b/i;
  [...root.querySelectorAll('h3,h4')].forEach(h=>{
    if(!actionWords.test(h.textContent||''))return;
    let section=h.nextElementSibling;
    if(!section)return;
    // Move only rendered transaction lists/tables, never input forms.
    if(!(section.matches('table,.grid,.card,[id*="Request"],[id*="request"],[id*="Application"],[id*="application"],[id*="Activity"],[id*="activity"]')))return;
    if(!nodes.includes(h))nodes.push(h);
    if(!nodes.includes(section))nodes.push(section);
  });
  if(!nodes.length)return;
  const holder=document.createElement('div');
  holder.className='hc-transactions-top';
  holder.setAttribute('data-page',page);
  nodes.forEach(n=>holder.appendChild(n));
  intro.insertAdjacentElement('afterend',holder);
}

  shipping:[['traveler','Traveler','Post a trip or accept items to carry.'],['sender','Sender','Post an item or request space from a traveler.']],
  rentals:[['owner','Property Owner','Post and manage rental properties.'],['rent_seeker','Rental Seeker','Find rentals and request viewing.']],
  truck:[['truck_owner','Truck Owner','Post driver jobs, manage applications, and use trailer rentals.'],['driver','Truck Driver','Create driver profile, apply for jobs, and request trailers.'],['truck_owner','Trailer Owner','Post trailers for rent and manage trailer requests.']],
  taxi:[['taxi_limo_owner','Taxi/Limo Owner','Post taxi/limo jobs, vehicles, and hire drivers.'],['taxi_limo_driver','Taxi/Limo Driver','Apply as a driver and accept ride requests.'],['customer','Customer','Request a taxi/limo ride.']],
  marketplace:[['marketplace','Marketplace Seller','Post items for sale and manage requests.'],['customer','Customer / Buyer','Browse items and request to buy.']],
  home_services:[['service_provider','Service Provider','Post home services and manage requests.'],['customer','Customer','Browse providers and request service.']],
  business:[['business_owner','Business Owner','Post your business profile and jobs.'],['customer','Customer','Find businesses in the community.']],
  jobs:[['job_seeker','Job Seeker','Browse jobs and contact businesses.']],
  events:[['event_organizer','Event Organizer','Post community events.'],['customer','Customer','Browse community events.']]
};
function selectedServiceRole(page){
  if(!currentUser||currentUser.role==='admin')return true;
  let choices=SERVICE_ROLE_CHOICES[page];
  if(!choices||!choices.length)return true;
  return currentUser.active_service===page && choices.some(c=>c[0]===currentUser.role);
}
function needsServiceChoice(page){
  return !!(currentUser && currentUser.role!=='admin' && SERVICE_ROLE_CHOICES[page] && !selectedServiceRole(page));
}
function serviceRolePanel(page){
  if(!currentUser)return `<div class="card"><h3>My Service</h3><p class="muted">Sign in first, then choose how you want to use this category.</p><button class="btn primary" onclick="show('account')">Sign In / Create Account</button></div>`;
  if(currentUser.role==='admin')return '';
  let choices=SERVICE_ROLE_CHOICES[page];
  if(!choices||!choices.length)return '';
  let seen=new Set();
  let cards=choices.filter(c=>{let k=c[0]+'_'+c[1]; if(seen.has(k))return false; seen.add(k); return true;}).map(c=>{
    let role=c[0], label=c[1], desc=c[2]||'';
    return `<div class="card"><h3>${label}</h3><p class="muted">${desc}</p><button class="btn primary" onclick="chooseServiceRole('${page}','${role}')">Continue as ${label}</button></div>`;
  }).join('');
  return `<div class="card"><h3>My Service</h3><p class="muted">Choose how you want to use this category. You can go back Home later and choose another service.</p></div><div class="grid">${cards}</div>`;
}
async function chooseServiceRole(page,role){
  if(!requireLogin())return;
  currentUser.roles=Array.isArray(currentUser.roles)?currentUser.roles:[];
  if(!currentUser.roles.includes(role))currentUser.roles.push(role);
  currentUser.role=role;
  currentUser.active_role=role;
  currentUser.active_service=page;
  localStorage.setItem('hc_active_role_'+currentUser.email,role);
  localStorage.setItem('hc_active_service_'+currentUser.email,page);
  let u=data.users.find(x=>x.email===currentUser.email);
  if(u){u.roles=currentUser.roles;u.role=role;u.active_role=role;u.active_service=page;}
  persistOnly();
  render();
  if(authReady()){
    let query=hcSupabase.from('profiles').update({roles:currentUser.roles,active_role:role,role:role});
    fireAndForget(currentUser.id?query.eq('id',currentUser.id):query.eq('email',currentUser.email),'service role sync');
  }
  await show(page);
  setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),80);
}
function categoryDashboard(title,subtitle,buttons){
  if(needsServiceChoice(currentPage))return serviceRolePanel(currentPage);
  return `<div class="card"><h3>${title}</h3>${subtitle?`<p class="muted">${subtitle}</p>`:''}<div class="actions">${buttons.join('')}</div></div>`;
}
function categoryButton(label,target,primary){
  let action=(target.includes('(')||target.startsWith('show('))?target:`jumpToSection('${target}')`;
  return `<button class="btn ${primary?'primary':'ghost'}" onclick="${action}">${label}</button>`;
}

function openService(page){
 if(!pages.includes(page))page='home';
 if(currentUser){
   // When a user opens a category from Home, always show the My Service choice box first.
   // After they choose Traveler/Sender/Owner/Driver/etc., chooseServiceRole() sets active_service to the page.
   currentUser.active_service='';
   currentUser.pending_service=page;
   localStorage.setItem('hc_pending_service_'+currentUser.email,page);
   localStorage.removeItem('hc_active_service_'+currentUser.email);
   let u=(data.users||[]).find(x=>cleanEmail(x.email)===cleanEmail(currentUser.email));
   if(u){u.active_service='';u.pending_service=page;}
   persistOnly();
 }
 show(page);
}

async function forgotPass(){let defaultEmail=cleanEmail($('loginEmail')?.value||'');let e=prompt('Enter the email address for password reset',defaultEmail);if(!e)return;e=cleanEmail(e);if(!e.includes('@'))return alert('Please enter a valid full email address.');if(authReady()){let redirect=location.origin+location.pathname;let {error}=await hcSupabase.auth.resetPasswordForEmail(e,{redirectTo:redirect});if(error)return alert('Password reset could not be sent: '+error.message);alert('Password reset email sent. Open the email and click the reset link. It will show New Password and Confirm Password boxes.');return;}addNote(e,'Password reset requested. In the real app, an email reset link will be sent.');save();alert('Password reset notification created.');}
function recoveryParams(){let url=new URL(location.href);let hash=new URLSearchParams((location.hash||'').replace(/^#/,''));return {url,hash,type:url.searchParams.get('type')||hash.get('type'),code:url.searchParams.get('code')||hash.get('code'),access_token:hash.get('access_token')}}
function isPasswordRecoveryUrl(){let r=recoveryParams();return r.type==='recovery'||!!r.code||!!r.access_token}
function showPasswordResetForm(msg=''){
  nav();
  $('userBox').innerHTML='<span class="pill warn">Password reset</span>';
  pages.forEach(x=>$(x).classList.add('hide'));
  $('account').classList.remove('hide');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  let nb=$('nav_account'); if(nb)nb.classList.add('active');
  if($('mobileNav'))$('mobileNav').value='account';
  $('account').innerHTML=`<div class="card" style="max-width:560px;margin:0 auto"><h2>Reset Password</h2><p class="muted">Enter a new password for your Habesha Connect account.</p>${msg?`<div class="notice">${msg}</div>`:''}<label>New Password</label>${passwordField('newResetPass','New password','new-password')}<label>Confirm Password</label>${passwordField('confirmResetPass','Confirm new password','new-password')}<button class="btn primary" onclick="updatePasswordFromReset()">Update Password</button><button class="btn ghost" onclick="location.href=location.origin+location.pathname">Back to Login</button></div>`;
}
async function handlePasswordRecovery(){
  if(!authReady()||!isPasswordRecoveryUrl())return false;
  let r=recoveryParams();
  if(r.code){
    let {error}=await hcSupabase.auth.exchangeCodeForSession(r.code);
    if(error){console.warn('Recovery code exchange failed',error);showPasswordResetForm('Reset link opened, but Supabase could not validate it. Please request a new reset email if update fails.');return true;}
  }
  showPasswordResetForm();
  try{history.replaceState(null,'',location.origin+location.pathname)}catch(e){}
  return true;
}
async function updatePasswordFromReset(){
  if(!authReady())return alert('Supabase is not connected.');
  let p=String($('newResetPass')?.value||'');let c=String($('confirmResetPass')?.value||'');
  if(p.length<8)return alert('Password must be at least 8 characters.');
  if(p!==c)return alert('Passwords do not match.');
  let {error}=await hcSupabase.auth.updateUser({password:p});
  if(error)return alert('Could not update password: '+error.message+'\nPlease request a new reset link and try again.');
  await hcSupabase.auth.signOut();
  alert('Password updated successfully. Please log in with your new password.');
  location.href=location.origin+location.pathname;
}

async function profile(){
 if(!requireLogin())return;
 let payments=data.payments.filter(p=>paymentVisibleForActiveRole(p));
 let myShips=data.shipments.filter(x=>x.senderEmail===currentUser.email||x.travelerEmail===currentUser.email||String(x.travelerId||'')===String(currentUser.id||'')||String(x.senderId||'')===String(currentUser.id||'')).length;
 let myRentals=data.rentals.filter(x=>x.ownerEmail===currentUser.email).length;
 let myReqs=(data.rentalRequests||[]).filter(x=>x.seekerEmail===currentUser.email||x.ownerEmail===currentUser.email).length;
 let myTrips=data.trips.filter(x=>x.travelerEmail===currentUser.email||String(x.travelerId||'')===String(currentUser.id||'')).length;
 const isMyTravelerShipment=s=>s.travelerEmail===currentUser.email||String(s.travelerId||'')===String(currentUser.id||'');
 const myTravelerShipments=(data.shipments||[]).filter(isMyTravelerShipment);
 const travelerRows=[];
 myTravelerShipments.forEach(s=>{
   const commission=(Number(s.weight)||0)*Number(settings().travelerCommissionPerLb||0);
   let trip=s.tripId?data.trips.find(t=>String(t.id)===String(s.tripId)||String(t.dbId)===String(s.tripId)):null;
   let refund=Number(s.travelerListingFeeRefund||0);
   if(!refund && trip && trip.listingFeePaid && (s.travelerPaid || ['Delivered','Completed'].includes(s.status||'')) && !trip.listingFeeRefunded){refund=Number(trip.listingFeeAmount||settings().travelerTripListingFee||10);}
   const total=s.travelerPaid?Number(s.travelerPayoutAmount||commission+refund):(commission+refund);
   if(commission>0){
     travelerRows.push({service:s.travelerPaid?'Traveler Payout Paid':'Traveler Commission',desc:`Commission for shipment ${s.tracking||s.id} (${Number(s.weight)||0} lb × ${money(settings().travelerCommissionPerLb)}/lb)`,amount:commission,time:s.travelerPaidAt||s.createdAt||'Pending'});
   }
   if(refund>0){
     travelerRows.push({service:s.travelerPaid?'Listing Fee Refunded':'Listing Fee Refund',desc:`Trip listing fee refund for shipment ${s.tracking||s.id}`,amount:refund,time:s.travelerPaidAt||'Pending payout'});
   }
   if(total>0){
     travelerRows.push({service:s.travelerPaid?'Total Payout Paid':'Total Expected Payout',desc:`Total traveler payout for shipment ${s.tracking||s.id}`,amount:total,time:s.travelerPaidAt||'Pending payout'});
   }
 });
 let travelerEarningsTable=myTravelerShipments.length?`<h3>My Traveler Earnings</h3><table><tr><th>Type</th><th>Description</th><th>Amount</th><th>Status / Time</th></tr>${travelerRows.map(p=>`<tr><td>${p.service}</td><td>${p.desc}</td><td>${money(p.amount)}</td><td>${p.time}</td></tr>`).join('')||'<tr><td colspan="4">No traveler earnings yet.</td></tr>'}</table>`:'';

}

async function sendMessage(){
 if(!requireLogin())return;
 let to=$('msgTo').value||'admin.habeshaconnect@gmail.com',txt=$('msgText').value.trim();
 if(!txt)return alert('Write a message first');
 if(authReady()){
   let sender=await getProfileByEmail(currentUser.email);
   let receiver=await getProfileByEmail(to);
   if(!receiver||!receiver.id)return alert('Receiver account was not found. Choose a registered user.');
   let {error}=await hcSupabase.from('messages').insert({sender_id:sender&&sender.id,receiver_id:receiver.id,message:txt,created_at:new Date().toISOString()});
   if(error)return alert('Could not send message: '+error.message);
   addNote(to,'New message from '+currentUser.name);sendEmailNotice({to,name:userDisplayByEmail(to),subject:'New message received',summary:'You received a new message from '+currentUser.name+'.',buttonText:'Open Messages',page:'messages',details:{From:currentUser.name,Message:txt.slice(0,180)}});
   await loadSupabaseMessages();
   show('messages');
   return;
 }
 data.messages.unshift({from:currentUser.email,to,text:txt,time:new Date().toLocaleString(),source:'local'});
 addNote(to,'New message from '+currentUser.name);sendEmailNotice({to,name:userDisplayByEmail(to),subject:'New message received',summary:'You received a new message from '+currentUser.name+'.',buttonText:'Open Messages',page:'messages',details:{From:currentUser.name,Message:txt.slice(0,180)}});

function recalcTripSpacesFromShipments(){
  (data.trips||[]).forEach(t=>{
    const used=(data.shipments||[])
      .filter(s=>String(s.tripId||'')===String(t.id||'') && ['Approved','Ready for Delivery','In Transit','Delivered','Completed'].includes(s.status||''))
      .reduce((sum,s)=>sum+(Number(s.weight)||0),0);
    const calculated=Math.max(0,(Number(t.totalSpace)||0)-used);
    if(!Number.isNaN(calculated)){
      if(t.availableSpace===undefined || calculated < Number(t.availableSpace)) t.availableSpace=calculated;
      if(t.availableSpace<=0) t.status='Full';
    }
  });
}

function addDaysIso(days){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function daysUntil(dateStr){if(!dateStr)return null;let d=new Date(dateStr+'T00:00:00');let now=new Date();now.setHours(0,0,0,0);return Math.ceil((d-now)/86400000);}
function expiryBadge(dateStr,label){let n=daysUntil(dateStr);if(n===null)return '<span class="pill warn">No '+label+' date</span>';if(n<0)return '<span class="pill bad">'+label+' expired</span>';if(n<=30)return '<span class="pill warn">'+label+' expires in '+n+' days</span>';return '<span class="pill good">'+label+' OK</span>';}
function activeTripSort(a,b){let ar=Number(a.availableSpace||0),br=Number(b.availableSpace||0);let ad=a.travelDate||'',bd=b.travelDate||'';if((ar>0)!==(br>0))return ar>0?-1:1; if(ad!==bd)return ad.localeCompare(bd);return String(b.id||'').localeCompare(String(a.id||''));}
function isTripBookable(t){let remaining=Number(t.availableSpace ?? t.remaining_space_lb ?? 0);let status=String(t.status||'Open');let travel=t.travelDate||'';let notFlown=!travel || travel>=addDaysIso(0);return remaining>0 && notFlown && ['Open','Approved'].includes(status) && !['Full','Closed','Cancelled','Canceled','Completed','Delivered','Flown'].includes(status);}

function friendlyRentalId(r,i){
  let raw=String((r&&r.id)||'');
  if(raw.startsWith('R')&&raw.length<=8)return raw;
  let n=(typeof i==='number'?i+1:Math.abs(raw.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%9999);
  return 'HC-R'+String(n).padStart(4,'0');
}

        if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.68));
      };
      img.onerror=reject;img.src=reader.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

function showTruckExpiryWarnings(){
 if(!currentUser)return;
 let role=currentUser.role;
 if(!['truck_owner','driver','admin'].includes(role))return;
 let key='hc_truck_expiry_notice_'+currentUser.email+'_'+new Date().toISOString().slice(0,10);
 if(sessionStorage.getItem(key))return;
 let records=(data.trucks||[]).filter(t=>role==='admin'||t.ownerEmail===currentUser.email||t.driverEmail===currentUser.email);
 let warnings=[];
 records.forEach(t=>{
   [['Insurance',t.insurance],['Registration',t.registration]].forEach(([label,val])=>{
     let n=daysUntil(val);
     if(n===null)return;
     if(n<0)warnings.push((t.truck||'Truck')+' '+label+' expired.');
     else if(n<=30)warnings.push((t.truck||'Truck')+' '+label+' will expire in '+n+' days.');
   });
 });
 if(warnings.length){sessionStorage.setItem(key,'1');alert('Truck document notice:\n\n'+warnings.join('\n'));}
}

async function adminFinalizeTrailerRental(id){if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');let item=(data.trailerRentals||[]).find(x=>x.id===id);if(!item)return alert('Trailer request not found.');if(!item.renterEmail)return alert('This trailer has no renter request to finalize.');if(item.status!=='Pending Final Admin Approval')return alert('This request is not waiting for final admin approval.');let old={...item};item.status='Rented';item.rentedAt=new Date().toLocaleString();let r=await updateTrailerRentalDb(item,{status:'Rented',rented_at:new Date().toISOString()});if(r.error){Object.assign(item,old);return alert('Could not finalize trailer rental: '+r.error.message);}sendEmailNotice({to:item.renterEmail,name:item.renterName,subject:'Complete your trailer rental',summary:'The trailer owner accepted your request and admin gave final approval. You can now complete the rent.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Trailer:item.trailerType,Owner:item.ownerName,OwnerEmail:item.ownerEmail,Location:item.location,Price:item.price,Status:'Ready to Complete Rent'}});sendEmailNotice({to:item.ownerEmail,name:item.ownerName,subject:'Trailer rental final approved',summary:'Admin gave final approval for the trailer rental request.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Requester:item.renterName,RequesterEmail:item.renterEmail,Trailer:item.trailerType,Status:'Rented'}});persistOnly();adminSuccess();setTimeout(()=>loadSupabaseTrucking().catch(console.warn),0);alert('Trailer rental final approved. Requester was notified.');}
async function adminDeclineTrailerRequest(id){if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');let item=(data.trailerRentals||[]).find(x=>x.id===id);if(!item)return alert('Trailer request not found.');if(!item.renterEmail)return alert('This trailer has no renter request to decline.');let renterEmail=item.renterEmail,renterName=item.renterName,trailerType=item.trailerType,ownerEmail=item.ownerEmail,ownerName=item.ownerName;item.status='Available';item.renterName='';item.renterEmail='';item.renterPhone='';let r=await updateTrailerRentalDb(item,{status:'Available',renter_name:'',renter_email:'',renter_phone:'',rented_at:null});if(r.error)return alert('Could not decline trailer request: '+r.error.message);if(renterEmail)sendEmailNotice({to:renterEmail,name:renterName,subject:'Trailer rental request declined',summary:'Your trailer rental request was declined by admin.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Trailer:trailerType,Status:'Declined'}});if(ownerEmail)sendEmailNotice({to:ownerEmail,name:ownerName,subject:'Trailer rental request declined by admin',summary:'Admin declined a trailer rental request for your trailer.',buttonText:'Open Trucking Dashboard',page:'truck',details:{Requester:renterName,Trailer:trailerType,Status:'Declined'}});persistOnly();adminSuccess();setTimeout(()=>loadSupabaseTrucking().catch(console.warn),0);alert('Trailer request declined and trailer is available again.');}

async function deleteTruckJob(id){if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');if(!confirm('Delete this truck job post?'))return;let j=(data.truckJobs||[]).find(x=>x.id===id);let r=await deleteTruckJobDb(j);if(r.error)return alert('Could not delete truck job in Supabase: '+r.error.message);data.truckJobs=(data.truckJobs||[]).filter(j=>j.id!==id);data.truckApplications=(data.truckApplications||[]).filter(a=>a.jobId!==id&&a.jobDbId!==(j&&j.dbId));persistOnly();adminSuccess();}

async function postHomeService(){if(!requireLogin())return;if(currentUser.role!=='service_provider'&&currentUser.role!=='business_owner'&&currentUser.role!=='admin')return alert('Only service providers, business owners, or admin can post home services. Add Home Service Provider in My Services first.');let title=($('hsTitle').value||'').trim(),category=$('hsCategory').value,city=($('hsCity').value||'').trim(),price=($('hsPrice').value||'').trim(),description=($('hsDescription').value||'').trim();if(!title||!city||!price||!description)return alert('Please complete service type, title, city, price, and description.');let item={id:'HS'+Date.now().toString().slice(-6),providerName:currentUser.name,providerEmail:currentUser.email,providerPhone:currentUser.phone||'',category,title,city,price,description,status:currentUser.role==='admin'?'Approved':'Pending Admin Approval',createdAt:new Date().toLocaleString()};let res=await syncHomeServicePostToSupabase(item);if(res.error)return alert('Home service was not saved to Supabase. Please run the Home Services SQL, then try again. '+res.error.message);data.homeServicePosts.unshift(item);addNote(currentUser.email,currentUser.role==='admin'?'Home service posted and approved: '+title+'.':'Home service submitted for admin approval: '+title+'.');if(currentUser.role!=='admin')sendAdminEmailNotice('Home service waiting for approval','A service provider submitted a new home service for admin approval.',{Provider:currentUser.name,Email:currentUser.email,Service:title,Category:category,City:city,Price:price},'admin');persistOnly();alert(currentUser.role==='admin'?'Home service posted and approved.':'Home service submitted.');homeServices();}
let activeHomeServiceRequestId='';
function requestHomeService(id){if(!requireLogin())return;let svc=(data.homeServicePosts||[]).find(p=>p.id===id);if(!svc)return alert('Service not found.');if(svc.status!=='Approved'&&svc.status!=='Available')return alert('This service is not approved yet.');if(svc.providerEmail===currentUser.email)return alert('You cannot request your own service.');activeHomeServiceRequestId=id;homeServices();setTimeout(()=>{let el=$('homeServiceRequestForm');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);}
function cancelHomeServiceRequest(){activeHomeServiceRequestId='';homeServices();}
async function submitHomeServiceRequest(){
 if(!requireLogin())return;
 let svc=(data.homeServicePosts||[]).find(p=>p.id===activeHomeServiceRequestId);
 if(!svc)return alert('Service not found. Please choose the service again.');
 let phone=($('hsReqPhone')?.value||'').trim();
 let city=($('hsReqCity')?.value||'').trim();
 let date=($('hsReqDate')?.value||'').trim();
 let time=($('hsReqTime')?.value||'').trim();
 let details=($('hsReqDetails')?.value||'').trim();
 if(!phone||!city||!date||!time||!details)return alert('Please complete phone, city/address area, preferred date, preferred time, and request details.');
 let preferredDate=date+' '+time;
 let summary='Please review your home service request before submitting:\n\nService: '+svc.title+'\nCategory: '+svc.category+'\nProvider: '+(svc.providerName||'')+'\nPhone: '+phone+'\nCity / Area: '+city+'\nPreferred Date: '+date+'\nPreferred Time: '+time+'\nDetails: '+details+'\n\nClick OK to submit this request, or Cancel to revise it.';
 if(!confirm(summary))return;
 let req={id:'HSR'+Date.now().toString().slice(-6),serviceId:svc.dbId||'',serviceLocalRef:svc.id,serviceTitle:svc.title,providerName:svc.providerName,providerEmail:svc.providerEmail,customerName:currentUser.name,customerEmail:currentUser.email,customerPhone:phone,city,preferredDate,preferredTime:time,details,status:'Pending Admin Approval',createdAt:new Date().toLocaleString()};
 let res=await syncHomeServiceRequestToSupabase(req,svc);
 if(res.error)return alert('Request was not saved to Supabase. Please run the Home Services SQL, then try again. '+res.error.message);
 data.homeServiceRequests.unshift(req);
 addNote(currentUser.email,'Home service request sent for admin approval: '+svc.title+'.');
 sendAdminEmailNotice('Home service request waiting for approval','A customer requested a home service. Admin approval is required before the provider receives it.',{Customer:currentUser.name,CustomerEmail:currentUser.email,Provider:svc.providerName,ProviderEmail:svc.providerEmail,Service:svc.title,City:city,PreferredDate:preferredDate,PreferredTime:time,Details:details},'admin');
 activeHomeServiceRequestId='';
 persistOnly();
 alert('Request sent. Admin approval is required before the provider receives it.');
 homeServices();
}

/* V7.8.32 Taxi/Limo Supabase sync helpers - removes local-only Taxi/Limo flow */
function taxiUiStatus(s){
  s=String(s||'').trim();
  const map={
    pending_admin:'Pending Admin Approval', pending:'Pending Admin Approval', approved:'Approved', declined:'Declined', suspended:'Suspended', inactive:'Inactive', ended:'Ended',
    waiting_driver_acceptance:'Waiting Driver Acceptance', pending_driver_acceptance:'Waiting Driver Acceptance',
    driver_accepted_pending_admin:'Pending Admin Approval', driver_declined:'Driver Declined'
  };
  return map[s]||s||'Pending Admin Approval';
}
function taxiOwnerDbStatus(s){
  s=taxiUiStatus(s);
  if(s==='Approved')return 'approved'; if(s==='Declined')return 'declined'; if(s==='Suspended')return 'suspended';
  return 'pending_admin';
}
function taxiDriverDbStatus(s){
  s=taxiUiStatus(s);
  if(s==='Approved')return 'approved'; if(s==='Declined')return 'declined';
  return 'pending';
}
function taxiAssignmentDbStatus(s){
  s=taxiUiStatus(s);
  if(s==='Waiting Driver Acceptance')return 'waiting_driver_acceptance';
  if(s==='Pending Admin Approval')return 'driver_accepted_pending_admin';
  if(s==='Approved')return 'approved';
  if(s==='Driver Declined')return 'driver_declined';
  if(s==='Declined')return 'declined';
  if(s==='Closed')return 'closed';
  if(s==='Ended')return 'ended';
  return 'waiting_driver_acceptance';
}

  if(!authReady())return null;

}
async function loadSupabaseTaxiLimo(){
  if(!authReady())return;
  try{
    let owners=await hcSupabase.from('taxi_limo_owners').select('*').order('created_at',{ascending:false});
    if(!owners.error){data.taxiLimoOwners=(owners.data||[]).map(o=>({dbId:o.id,id:o.id,ownerId:o.owner_id,ownerName:o.owner_name||o.ownerName||'',ownerEmail:o.owner_email||o.ownerEmail||'',phone:o.phone||'',companyName:o.company_name||o.companyName||'',city:o.city||'',status:taxiUiStatus(o.status),adminNote:o.admin_note||'',createdAt:o.created_at||''}));}
  }catch(e){console.warn('Taxi/Limo owners load skipped',e);}
  try{
    let vehicles=await hcSupabase.from('taxi_limo_vehicles').select('*').order('created_at',{ascending:false});
    if(!vehicles.error){data.taxiLimoVehicles=(vehicles.data||[]).map(v=>({dbId:v.id,id:v.id,ownerId:v.owner_application_id||v.owner_id,ownerName:v.owner_name||'',ownerEmail:v.owner_email||'',companyName:v.company_name||'',vehicleType:v.vehicle_type||'Taxi',make:v.make||'',model:v.model||'',year:v.year||'',plate:v.plate_number||v.plate||'',docs:v.docs_note||'',status:taxiUiStatus(v.status),createdAt:v.created_at||''}));}
  }catch(e){console.warn('Taxi/Limo vehicles load skipped',e);}

function taxiRideActions(r){
 let out=[];
 if(r.riderEmail===currentUser.email && r.status==='Pending Admin Approval')out.push(`<button class="btn bad" onclick="cancelTaxiRide('${r.id}')">Cancel</button>`);
 if((currentUser.role==='taxi_limo_driver'||currentUser.role==='taxi_driver'||findTaxiApp(currentUser.email)) && r.status==='Approved - Waiting Driver' && r.driverEmail!==currentUser.email && !(r.declinedBy||[]).includes(currentUser.email))out.push(`<button class="btn primary" onclick="driverAcceptTaxi('${r.id}')">Accept Ride</button><button class="btn bad" onclick="driverDeclineTaxi('${r.id}')">Decline</button>`);
 if(r.driverEmail===currentUser.email && r.status==='Driver Approved - Contact Shared')out.push(`<button class="btn ghost" onclick="taxiArrived('${r.id}')">Arrived</button><button class="btn primary" onclick="taxiStartRide('${r.id}')">Start Ride</button>`);
 if(r.driverEmail===currentUser.email && r.status==='In Progress')out.push(`<button class="btn primary" onclick="taxiCompleteRide('${r.id}')">Complete Ride</button>`);
 if(r.driverEmail===currentUser.email && r.status==='Completed - Admin Verified')out.push(`<button class="btn primary" onclick="taxiPaymentReceived('${r.id}')">Payment Received</button>`);
 return out.join(' ')||'-';
}

function bmNormalizeStatus(s){
  s=String(s||'').trim();

  const map={approved:'Approved',open:'Approved',active:'Approved',public:'Approved',pending:'Pending Admin Approval',pending_admin:'Pending Admin Approval',pending_approval:'Pending Admin Approval',pending_admin_approval:'Pending Admin Approval',waiting_admin:'Pending Admin Approval',waiting_admin_approval:'Pending Admin Approval',declined:'Declined',rejected:'Declined',deleted:'Deleted'};

}

function mapBusinessRecordFromDb(row){
  let d=row.details||{};
  let rowStatus=bmNormalizeStatus(row.status||'Pending Admin Approval');
  let detailStatus=bmNormalizeStatus(d.status||'');
  let mergedStatus=(rowStatus&&rowStatus!=='Pending Admin Approval')?rowStatus:(detailStatus||rowStatus||'Pending Admin Approval');
  return Object.assign({},d,{id:row.local_ref||d.id||String(row.id),dbId:row.id,recordType:row.record_type||d.recordType||'business_profile',businessName:row.business_name||d.businessName||d.name||'Business',name:row.business_name||d.name||'Business',category:row.business_type||d.category||d.type||'Other',type:row.business_type||d.type||d.category||'Other',ownerEmail:row.owner_email||d.ownerEmail||'',date:row.record_date||d.date||new Date().toISOString().slice(0,10),status:mergedStatus,source:'supabase'});
}
let businessDirectoryLoading=false;
let businessDirectoryLoadedAt=0;
async function loadBusinessFromSupabase(options){
  options=options||{};
  if(!authReady())return;
  if(businessDirectoryLoading)return;
  if(!options.force && Date.now()-businessDirectoryLoadedAt<30000)return;
  businessDirectoryLoading=true;
  try{
    let q=hcSupabase.from('business_records').select('*').eq('record_type','business_profile').order('created_at',{ascending:false});
    let res=await q;
    if(res.error){console.warn('Business Directory Supabase load error',res.error);return res;}
    let remote=(res.data||[]).map(mapBusinessRecordFromDb);
    let localOnly=businessRecords().filter(x=>x.source!=='supabase'&&!x.dbId);
    data.businesses=[...remote,...localOnly];
    businessDirectoryLoadedAt=Date.now();
    persistOnly();
    // Business page: refresh only the public list so phone dropdowns do not close.
    if(currentPage==='business' && $('businessList')){
      filterBusinessDirectory();
      let my=bmMyProfile();
      let holder=$('businessOwnerPanel');
      if(holder)holder.innerHTML=businessOwnerPanel(my);
    }
    // Admin page: rebuild after pending profiles load so approvals appear.
    if(currentPage==='admin' && !adminBackgroundRefreshing && $('admin')){
      setTimeout(()=>{try{admin();}catch(e){console.warn('Admin business refresh render failed',e);}},0);
    }
    return res;
  }catch(e){
    console.warn('Business Directory background load failed',e);
    return {error:e};
  }finally{
    businessDirectoryLoading=false;
  }
}
async function syncBusinessRecordToSupabase(rec){
  if(!authReady()||!currentUser||!rec)return {error:null};
  try{
    let ownerEmail=rec.ownerEmail||rec.owner_email||rec.createdBy||currentUser.email||'';
    rec.status=bmNormalizeStatus(rec.status||'Pending Admin Approval');
    let details=Object.assign({},rec,{status:rec.status,recordType:'business_profile'});
    let payload={
      local_ref:rec.id,
      business_name:rec.businessName||rec.name||'Business',
      business_type:rec.category||rec.type||'Other',
      record_type:'business_profile',
      period:'Directory',
      record_date:rec.date||new Date().toISOString().slice(0,10),
      income_amount:0,expense_amount:0,amount:0,
      notes:rec.about||rec.description||'',
      owner_email:ownerEmail,
      owner_id:rec.ownerId||rec.owner_id||ownerEmail||businessUserKey(),
      status:rec.status,
      details:details,
      updated_at:new Date().toISOString()
    };
    let res;
    if(rec.dbId){
      res=await hcSupabase.from('business_records').update(payload).eq('id',rec.dbId).select().single();
      if(res.error&&String(res.error.message||'').toLowerCase().includes('no rows'))res=await hcSupabase.from('business_records').upsert(payload,{onConflict:'local_ref'}).select().single();
    }else{
      res=await hcSupabase.from('business_records').upsert(payload,{onConflict:'local_ref'}).select().single();
    }
    if(!res.error&&res.data){rec.dbId=res.data.id;rec.source='supabase';rec.status=bmNormalizeStatus(res.data.status||rec.status);persistOnly();}
    else if(res.error){console.warn('Business Directory Supabase save error',res.error);}
    return res;
  }catch(e){console.warn('Business Directory background save failed',e);return {error:e};}
}

async function approveTravelerTrip(id){
 if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');
 let t=(data.trips||[]).find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
 if(!t)return alert('Trip not found.');
 let old=t.status;t.status='Open';
 if(authReady()&&t.dbId){let {error}=await hcSupabase.from('trips').update({status:'Open'}).eq('id',t.dbId);if(error){t.status=old;return alert('Could not approve trip: '+error.message);}}
 addNote(t.travelerEmail,'Your traveler trip '+(t.route||'')+' was approved by admin and is now visible to senders.');
 if(t.travelerEmail)sendEmailNotice({to:t.travelerEmail,name:t.traveler||'Traveler',subject:'Traveler Trip Approved',summary:'Your traveler trip was approved by admin and is now visible to senders.',buttonText:'Open Shipping Dashboard',page:'shipping',details:{Route:t.route||'',Date:t.travelDate||'',Space:(t.availableSpace||0)+' lb',Status:'Approved'}});
 persistOnly();adminSuccess();
}
async function declineTravelerTrip(id){
 if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');
 let t=(data.trips||[]).find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
 if(!t)return alert('Trip not found.');
 let reason=prompt('Reason for declining this trip?','Admin declined this traveler trip.');
 if(reason===null)return;
 let old=t.status;t.status='Declined';
 if(authReady()&&t.dbId){let {error}=await hcSupabase.from('trips').update({status:'Declined'}).eq('id',t.dbId);if(error){t.status=old;return alert('Could not decline trip: '+error.message);}}
 addNote(t.travelerEmail,'Your traveler trip '+(t.route||'')+' was declined by admin. '+(reason||''));
 if(t.travelerEmail)sendEmailNotice({to:t.travelerEmail,name:t.traveler||'Traveler',subject:'Traveler Trip Declined',summary:'Your traveler trip was declined by admin.',buttonText:'Open Shipping Dashboard',page:'shipping',details:{Route:t.route||'',Date:t.travelDate||'',Reason:reason||'Admin declined this trip',Status:'Declined'}});
 persistOnly();adminSuccess();
}

async function adminApproveBusinessProfile(id){
  if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');
  let b=businessRecords().find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!b)return alert('Business profile not found.');
  if(bmNormalizeStatus(b.status)!=='Pending Admin Approval')return alert('This business profile is already '+bmNormalizeStatus(b.status)+'.');
  b.status='Approved';b.approvedAt=new Date().toLocaleString();b.details=Object.assign({},b.details||{},b,{status:'Approved'});
  persistOnly();
  let res=await safeAsync(syncBusinessRecordToSupabase(b),9000,'business approve sync');
  if(res&&res.error){b.status='Pending Admin Approval';persistOnly();return alert('Business was not approved in Supabase: '+(res.error.message||res.error));}
  await loadBusinessFromSupabase({force:true});
  addNote(b.ownerEmail,'Your Business Directory profile was approved and is now visible to customers.');
  sendEmailNotice({to:b.ownerEmail,name:b.ownerName||b.businessName,subject:'Business Directory approved',summary:'Admin approved your Business Directory profile. Customers can now see it in the Business Directory.',buttonText:'Open Business Directory',page:'business',details:{Business:b.businessName||b.name,Category:b.category||b.type,Status:'Approved'}});
  adminSuccess('Business Directory approved. It stays marked Approved and is visible to customers.');
}
async function adminDeclineBusinessProfile(id){
  if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');
  let b=businessRecords().find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!b)return alert('Business profile not found.');
  if(bmNormalizeStatus(b.status)!=='Pending Admin Approval')return alert('This business profile is not waiting for admin decision.');
  b.status='Declined';b.declinedAt=new Date().toLocaleString();b.details=Object.assign({},b.details||{},b,{status:'Declined'});
  persistOnly();
  let res=await safeAsync(syncBusinessRecordToSupabase(b),9000,'business decline sync');
  if(res&&res.error){return alert('Business declined on this screen, but Supabase did not save the declined status: '+(res.error.message||res.error));}
  await loadBusinessFromSupabase({force:true});
  addNote(b.ownerEmail,'Your Business Directory profile was declined by admin.');
  sendEmailNotice({to:b.ownerEmail,name:b.ownerName||b.businessName,subject:'Business Directory declined',summary:'Admin declined your Business Directory profile.',buttonText:'Open Business Directory',page:'business',details:{Business:b.businessName||b.name,Status:'Declined'}});
  adminSuccess('Business Directory declined.');
}
async function adminDeleteBusinessProfile(id){
  if(!currentUser||currentUser.role!=='admin')return alert('Admin only.');
  let b=businessRecords().find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!b)return alert('Business profile not found.');
  if(!confirm('Delete this Business Directory profile? It will be removed from customers.'))return;
  if(authReady()&&(b.dbId||b.id)){
    let q=hcSupabase.from('business_records').delete();
    q=b.dbId?q.eq('id',b.dbId):q.eq('local_ref',b.id);
    let {error}=await q;
    if(error)return alert('Could not delete from Supabase: '+error.message);
  }
  data.businesses=businessRecords().filter(x=>String(x.id)!==String(id)&&String(x.dbId)!==String(id));
  persistOnly();
  await loadBusinessFromSupabase({force:true});
  adminSuccess('Business Directory deleted. Customers will not see it.');
}

function adminPendingCount(){
 const pendingWords=['pending','waiting','review','payment pending'];
 const groups=[data.trips,data.shipments,data.shippingItems,data.rentals,data.rentalRequests,data.jobs,data.truckJobs,data.truckApplications,data.trailerRentals,data.market,data.homeServicePosts,data.homeServiceRequests,data.homeServiceCustomerJobs,data.businesses,data.events,data.taxiLimoOwners,data.taxiLimoVehicles,data.taxiDriverApps,data.taxiLimoDriverAssignments,data.taxiRideRequests];
 let count=0;
 groups.forEach(list=>(list||[]).forEach(x=>{let st=String(x.status||'').toLowerCase();if(pendingWords.some(w=>st.includes(w)))count++;}));
 return count;
}

function buildAdminPendingQueue(){
 const root=$('admin'), grid=$('adminPendingQueueGrid'), badge=$('adminPendingQueueCount');
 if(!root||!grid||!badge)return;
 const pendingRows=[...root.querySelectorAll('table tr.adminPendingRow')].filter(row=>!row.closest('#adminPendingQueue'));
 const sequence=[...root.querySelectorAll('h3, table')];
 let lastHeading='Admin';
 const tableHeadings=new Map();
 sequence.forEach(el=>{if(el.tagName==='H3')lastHeading=el.textContent.trim();else tableHeadings.set(el,lastHeading)});
 grid.innerHTML='';
 pendingRows.forEach((row,index)=>{
   const table=row.closest('table');
   const category=tableHeadings.get(table)||'Admin Review';
   const cells=[...row.querySelectorAll('td')];
   const card=document.createElement('div');card.className='adminPendingCard';card.dataset.pendingIndex=String(index);
   const title=document.createElement('h4');title.textContent=category;card.appendChild(title);
   cells.forEach(cell=>{
     const label=cell.getAttribute('data-label')||'Detail';
     if(/actions?/i.test(label)){
       const actions=document.createElement('div');actions.className='adminPendingActions';
       [...cell.children].forEach(child=>actions.appendChild(child.cloneNode(true)));
       if(!actions.children.length){const span=document.createElement('span');span.innerHTML=cell.innerHTML;actions.appendChild(span)}
       card.appendChild(actions);
     }else{
       const field=document.createElement('div');field.className='adminPendingField';
       const b=document.createElement('b');b.textContent=label;field.appendChild(b);
       const value=document.createElement('div');value.innerHTML=cell.innerHTML;field.appendChild(value);card.appendChild(field);
     }
   });
   grid.appendChild(card);
   // Pending transactions live only in the top Verification Center queue.
   // Once Admin acts, the refreshed row loses its pending status and appears
   // again in the appropriate category section with its new status.
   row.style.display='none';
   row.setAttribute('aria-hidden','true');
 });
 badge.textContent=String(pendingRows.length);
 if(!pendingRows.length)grid.innerHTML='<div class="notice"><b>No pending admin actions.</b> New submissions will appear here automatically after Refresh.</div>';
}

function decorateAdminMobileTables(){
 const root=$('admin');if(!root)return;
 root.querySelectorAll('table').forEach(table=>{
   table.classList.add('adminMobileTable');
   const headerRow=table.querySelector('tr');
   const labels=headerRow?[...headerRow.querySelectorAll('th')].map(th=>th.textContent.trim()):[];
   [...table.querySelectorAll('tr')].forEach((row,ri)=>{
     if(ri===0&&row.querySelector('th'))return;
     [...row.children].forEach((cell,i)=>{if(cell.tagName==='TD')cell.setAttribute('data-label',labels[i]||('Detail '+(i+1)));});
     const text=row.textContent.toLowerCase();
     const actionText=[...row.querySelectorAll('button')].map(btn=>btn.textContent.trim().toLowerCase()).join(' | ');
     const pendingStatus=text.includes('pending')||text.includes('waiting')||text.includes('review')||text.includes('needs admin')||text.includes('manual payment')||text.includes('requested');
     // V7.8.180: User verification stays in its separate Verify Users section.
     // Transaction approvals remain in the top queue while a real Admin workflow
     // action is available. Edit/Delete alone do not make
     // a completed transaction pending.
     const actionableAdminButton=/(approve|decline|reject|mark delivered|mark complete|complete work|pay traveler|payout|refund|release payment|confirm payment|final approval|activate|deactivate|close transaction)/i.test(actionText);
     const onlyMaintenanceButtons=actionText && !actionableAdminButton && actionText.split('|').every(x=>/^(edit|delete|view|details|open|message|refresh|unverify)?$/.test(x.trim()));
     const needsAdminAction=pendingStatus||actionableAdminButton;
     if(needsAdminAction&&!onlyMaintenanceButtons)row.classList.add('adminPendingRow');
   });
 });
}

async function approveUser(email){
  let u=data.users.find(x=>x.email===email);
  if(!u)return alert('User not found.');
  let old=!!u.verified; u.verified=true;
  let res={error:null};
  if(authReady())res=await hcSupabase.from('profiles').update({verified:true}).eq('email',email);
  if(res.error){u.verified=old;return alert('Could not verify user in Supabase: '+res.error.message)}
  data.trips.forEach(t=>{if(t.travelerEmail===email)t.travelerVerified=true});
  data.shipments.forEach(s=>{if(s.senderEmail===email)s.senderVerified=true;if(s.travelerEmail===email)s.travelerVerified=true});
  addNote(u.email,'Your Habesha Connect account was verified by admin.');
  persistOnly();
  await refreshAdminData();
  adminSuccess();
}
async function unverifyUser(email){
  let u=data.users.find(x=>x.email===email);

  let old=!!u.verified; u.verified=false;
  let res={error:null};
  if(authReady())res=await hcSupabase.from('profiles').update({verified:false}).eq('email',email);

}
async function editUser(email){
  let u=data.users.find(x=>x.email===email);
  if(!u)return alert('User not found.');
  let name=prompt('Edit full name:',u.name); if(name===null)return;
  let phone=prompt('Edit phone number:',u.phone||''); if(phone===null)return;
  let role=prompt('Edit active role (sender, traveler, owner, rent_seeker, customer, driver, business_owner, admin):',u.role||u.active_role||'customer'); if(role===null)return;
  name=name.trim()||u.name; phone=phone.trim(); role=role.trim()||u.role||'customer';
  let old={name:u.name,phone:u.phone,role:u.role,active_role:u.active_role,roles:[...(u.roles||[])]};
  u.name=name;u.phone=phone;u.role=role;u.active_role=role;if(!Array.isArray(u.roles))u.roles=[];if(!u.roles.includes(role))u.roles.push(role);

async function deleteUser(email){
  let u=data.users.find(x=>x.email===email);
  if(!u)return alert('User not found.');
  if((u.roles||[]).includes('admin')||u.role==='admin')return alert('Admin account cannot be deleted here.');
  if(!confirm('Delete profile for '+u.name+'? This removes the profile row, not the Supabase Auth login.'))return;
  let backup=[...data.users];
  data.users=data.users.filter(x=>x.email!==email);
  let res={error:null};
  if(authReady())res=await hcSupabase.from('profiles').delete().eq('email',email);
  if(res.error){data.users=backup;return alert('Could not delete profile in Supabase: '+res.error.message)}
  persistOnly(); await refreshAdminData(); adminSuccess();
}

async function markDelivered(id){
  let s=data.shipments.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!s)return alert('Shipment not found.');
  if(!confirm('Mark shipment '+(s.tracking||id)+' as delivered/completed? It will only show in Admin after this.'))return;
  let old=s.status;s.status='Delivered';
  let relatedTrip=s.tripId?data.trips.find(t=>String(t.id)===String(s.tripId)||String(t.dbId)===String(s.tripId)):null;
  let oldTrip=relatedTrip?{status:relatedTrip.status,availableSpace:relatedTrip.availableSpace}:null;
  if(relatedTrip){relatedTrip.status='Delivered';relatedTrip.availableSpace=0;}
  let res={error:null};
  if(authReady()&&s.dbId)res=await hcSupabase.from('shipments').update({status:'Delivered'}).eq('id',s.dbId);
  if(!res.error&&authReady()&&relatedTrip&&relatedTrip.dbId)res=await hcSupabase.from('trips').update({status:'Delivered',remaining_space_lb:0}).eq('id',relatedTrip.dbId);
  if(res.error){s.status=old;if(relatedTrip&&oldTrip)Object.assign(relatedTrip,oldTrip);return alert('Could not mark delivered in Supabase: '+res.error.message)}
  addNote('admin.habeshaconnect@gmail.com','Shipment '+(s.tracking||id)+' was marked delivered. The related traveler trip is removed from sender availability.');
  if(s.senderEmail){addNote(s.senderEmail,'Your shipment '+(s.tracking||id)+' was marked delivered.');sendEmailNotice({to:s.senderEmail,name:s.sender||'Sender',subject:'Shipment delivered',summary:'Your shipment was marked delivered.',buttonText:'Open Shipping Dashboard',page:'shipping',details:{Tracking:s.tracking||id,Status:'Delivered'}});}
  if(s.travelerEmail){addNote(s.travelerEmail,'Shipment '+(s.tracking||id)+' was marked delivered. Admin can now process payout.');sendEmailNotice({to:s.travelerEmail,name:s.traveler||'Traveler',subject:'Shipment marked delivered',summary:'The shipment was marked delivered. Admin can now process traveler payout.',buttonText:'Open Shipping Dashboard',page:'shipping',details:{Tracking:s.tracking||id,Status:'Delivered'}});}
  persistOnly(); await refreshAdminData(); adminSuccess();
}

async function payTraveler(id){
  let s=data.shipments.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!s)return alert('Shipment not found.');
  if(!['Delivered','Completed'].includes(s.status||'')){
    if(!confirm('Traveler payout is recommended only after delivery is completed. Continue anyway?'))return;
  }
  if(s.travelerPaid){alert('Traveler payout is already marked paid.');return;}
  let baseAmount=Number(s.weight||0)*settings().travelerCommissionPerLb;
  let trip=s.tripId?data.trips.find(t=>String(t.id)===String(s.tripId)):null;
  let listingRefund=(trip&&trip.listingFeePaid&&!trip.listingFeeRefunded)?Number(trip.listingFeeAmount||settings().travelerTripListingFee||10):0;
  let amount=baseAmount+listingRefund;
  let method=prompt('Payout method (Zelle, PayPal, Cash App, Bank Transfer, Cash):','Zelle'); if(method===null)return;
  let note=prompt('Payout note or confirmation number:','Manual payout completed'); if(note===null)return;
  s.travelerPaid=true;
  s.travelerPaidAt=new Date().toLocaleString();
  s.travelerPayoutMethod=method||'Manual';
  s.travelerPayoutNote=note||'';
  s.status='Completed';
  await recordPayment('Traveler Payout',amount,'Traveler commission payout for shipment '+(s.tracking||s.id)+(listingRefund?' including '+money(listingRefund)+' trip listing fee refund':'')+' via '+s.travelerPayoutMethod,s.travelerEmail||'traveler');
  let res={error:null};
  if(authReady()&&s.dbId){
    res=await hcSupabase.from('shipments').update({traveler_paid:true,traveler_paid_at:new Date().toISOString(),traveler_payout_method:s.travelerPayoutMethod,traveler_payout_note:s.travelerPayoutNote,listing_fee_refund:listingRefund,status:'Completed'}).eq('id',s.dbId);
    if(res.error&&String(res.error.message||'').toLowerCase().includes('column')){
      alert('Traveler payout was recorded locally. Supabase is missing traveler payout columns. Please run the latest Supabase SQL for this project.');
      res={error:null};
    }
  }
  if(res.error){s.travelerPaid=false;return alert('Could not save traveler payout in Supabase: '+res.error.message)}
  s.travelerListingFeeRefund=listingRefund;s.travelerPayoutAmount=amount;
  if(trip&&listingRefund){trip.listingFeeRefunded=true;if(authReady()&&trip.dbId){await hcSupabase.from('trips').update({listing_fee_refunded:true}).eq('id',trip.dbId);}}
  addNote(s.travelerEmail||'all','Your traveler commission for shipment '+(s.tracking||s.id)+' was marked paid by admin.');
  sendEmailNotice({
    to:s.travelerEmail,
    name:s.traveler,
    subject:'Your Payout Has Been Released',
    summary:'Good news! Your payout for the completed shipment has been released.',
    buttonText:'Open Traveler Dashboard',
    page:'shipping',
    details:{
      Tracking:s.tracking||s.id,
      Sender:s.sender||'Sender',
      Route:s.route||'',
      Amount:money(amount),
      Method:s.travelerPayoutMethod||'Manual',
      Note:s.travelerPayoutNote||''
    }
  });
  persistOnly(); await refreshAdminData(); adminSuccess();
}

function setupAdminOneClickProtection(){
  document.addEventListener('click', function(e){
    const btn=e.target.closest('#admin button, #services button');
    if(!btn) return;
    if(btn.dataset.busy==='1'){
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
    const isActionButton = /Verify|Unverify|Approve|Delete|Edit|Toggle|Save My Services/.test((btn.textContent||''));
    if(!isActionButton) return;
    btn.dataset.busy='1';
    btn.dataset.oldText=btn.textContent;
    setTimeout(()=>{
      btn.disabled=true;
      btn.textContent='Working...';
      btn.style.opacity='0.65';
      btn.style.cursor='wait';
    },0);
    // Re-enable fallback in case a prompt is cancelled or Supabase is slow.
    setTimeout(()=>{
      if(document.body.contains(btn)){
        btn.disabled=false;
        btn.textContent=btn.dataset.oldText||btn.textContent;
        btn.dataset.busy='0';
        btn.style.opacity='';
        btn.style.cursor='';
      }
    },6500);
  }, true);
}

  return `<div${wrapId}><h3>Rental Requests / Contacts</h3><table><tr><th>Property</th><th>Rent Seeker</th><th>Phone</th><th>Owner</th><th>Owner Phone</th><th>Status</th><th>Action</th></tr>${reqs.map(q=>{let pending=['Pending','Pending Owner Review'].includes(q.status);return `<tr><td>${q.propertyTitle}</td><td>${q.seekerName}</td><td>${q.seekerPhone||''}</td><td>${q.ownerName}</td><td>${q.status==='Approved'||role==='admin'||role==='owner'?q.ownerPhone:'Shown after owner approval'}</td><td>${q.status}</td><td>${(role==='owner'||role==='admin')&&pending?`<button class="btn primary" onclick="approveRentalReq('${q.id}')">Approve</button> <button class="btn bad" onclick="declineRentalReq('${q.id}')">Decline</button>`:'-'}</td></tr>`}).join('')||'<tr><td colspan="7">No rental requests yet.</td></tr>'}</table></div>`;

approveRentalReq=async function(id){
  let q=data.rentalRequests.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));
  if(!q)return alert('Rental request not found.');
  if(currentUser&&currentUser.role!=='admin'&&q.ownerEmail!==currentUser.email)return alert('Only the property owner can approve this request.');
  let oldStatus=q.status;
  q.status='Approved';
  addNote(q.seekerEmail,'Your rental request was approved by the owner. Owner contact is now available.');
  sendEmailNotice({to:q.seekerEmail,name:q.seekerName,subject:'Rental viewing approved',summary:'The property owner approved your viewing request. Owner contact is now available.',buttonText:'Open Rental Dashboard',page:'rentals',details:{Property:q.propertyTitle,Owner:q.ownerName,OwnerPhone:q.ownerPhone,Status:'Approved'}});
  persistOnly();
  if(currentPage==='admin') adminSuccess(); else await rentals();
  let res={error:null};
  if(authReady()&&q.dbId)res=await hcSupabase.from('rental_requests').update({status:'Approved'}).eq('id',q.dbId);
  if(res.error){q.status=oldStatus;persistOnly();if(currentPage==='admin')adminSuccess();else await rentals();return alert('Could not approve rental request in Supabase: '+res.error.message);}
};

declineRentalReq=async function(id){
  let q=data.rentalRequests.find(x=>String(x.id)===String(id)||String(x.dbId)===String(id));if(!q)return;
  if(currentUser&&currentUser.role!=='admin'&&q.ownerEmail!==currentUser.email)return alert('Only the property owner can decline this request.');
  q.status='Declined';
  if(authReady()&&q.dbId){let {error}=await hcSupabase.from('rental_requests').update({status:'Declined'}).eq('id',q.dbId);if(error)return alert('Could not decline rental request: '+error.message);}

  persistOnly(); if(currentPage==='admin')adminSuccess();else await rentals();
};

/* MARKETPLACE: Admin approves listing only. Buyer request goes directly to seller. Seller accept waits for admin manual payment approval. */
marketRequestBuy=async function(id){
  if(!requireLogin())return;
  let m=marketFindItemV7859(id);if(!m)return alert('Marketplace item was not found. Please refresh Marketplace and try again.');
  if(!marketItemStillAvailableV7859(m))return alert('This item is not available for buyer requests.');
  if(m.sellerEmail===currentUser.email)return alert('You cannot request your own item.');
  let exists=(data.marketRequests||[]).find(r=>String(r.itemId)===String(m.dbId||m.id)&&r.buyerEmail===currentUser.email&&!['Cancelled','Admin Declined','Seller Declined','Connection Declined','Completed'].includes(r.status));
  if(exists)return alert('You already requested this item.');
  let r={id:'MR'+Date.now().toString().slice(-5),itemId:m.dbId||m.id,itemTitle:m.title,buyerName:currentUser.name,buyerEmail:currentUser.email,buyerPhone:currentUser.phone||'',sellerName:m.seller,sellerEmail:m.sellerEmail,sellerPhone:m.sellerPhone||'',status:'Waiting Seller Review',createdAt:new Date().toLocaleString()};

/* V7.8.71 Rental Owner Decision Safe Fix
   Based on the stable V7.8.69 file. This patch avoids blank-page changes and only
   corrects Rental request behavior:
   - seeker request goes to owner review
   - owner Accept marks the property Rented
   - owner Decline keeps property Approved/Available
   - admin sees final property status, but does not perform a second approval
*/
function __rentalFindRequestV7871(id){
  return (data.rentalRequests||[]).find(x=>String(x.id)===String(id)||String(x.dbId||'')===String(id));
}
function __rentalFindPropertyForReqV7871(q){
  if(!q)return null;
  return (data.rentals||[]).find(r=>String(r.id)===String(q.rentalId)||String(r.dbId||'')===String(q.rentalId)||String(r.id)===String(q.propertyId)||String(r.dbId||'')===String(q.propertyId));
}
async function __rentalUpdateRequestV7871(q,fields){
  try{
    if(authReady()&&q&&(q.dbId||q.id)){
      let {error}=await hcSupabase.from('rental_requests').update(fields).eq('id',q.dbId||q.id);
      if(error)return {error};
    }
  }catch(e){return {error:e};}
  return {error:null};
}
async function __rentalUpdatePropertyV7871(r,fields){
  try{
    if(authReady()&&r&&(r.dbId||r.id)){
      let {error}=await hcSupabase.from('properties').update(fields).eq('id',r.dbId||r.id);
      if(error)return {error};
    }
  }catch(e){return {error:e};}
  return {error:null};
}

rentalRequestActionButtons=function(q,role){
  const st=String((q&&q.status)||'Pending');
  const id=q&&q.id;
  if(!id)return '-';
  if(role==='owner'){
    if(['Pending Owner Review','Pending','Waiting Owner Review'].includes(st)){
      return `<button class="btn primary" onclick="ownerAcceptRentalReq('${id}')">Accept</button> <button class="btn bad" onclick="ownerDeclineRentalReq('${id}')">Decline</button>`;
    }
    return '-';
  }
  if(role==='admin'){
    if(['Pending Owner Review','Pending','Waiting Owner Review'].includes(st))return '<span class="pill warn">Waiting Owner Review</span>';
    if(st==='Approved'||st==='Rented')return '<span class="pill good">Owner Accepted</span>';
    if(st==='Declined')return '<span class="pill bad">Declined</span>';
    return '-';
  }
  return '-';
};

<script id="v78110-user-mobile-script">
(function(){
  const priorityWords=['pending','new','waiting','requested','request sent','action required','payment pending','needs approval','available'];
  const completedWords=['approved','declined','rejected','completed','delivered','paid out','closed','cancelled','rented','hired'];

  function isAdminView(){
    try{return (window.currentPage==='admin') || (window.currentUser && window.currentUser.role==='admin');}
    catch(e){return false;}
  }
  function rowPriority(row){
    const text=(row.innerText||'').toLowerCase();
    const actionText=[...row.querySelectorAll('button,a.btn')].map(x=>(x.innerText||'').toLowerCase()).join(' ');
    const hasUsefulAction=/(request|apply|accept|approve|pay|confirm|respond|book|contact)/.test(actionText);
    if(hasUsefulAction) return 3;
    if(priorityWords.some(w=>text.includes(w))) return 2;
    if(completedWords.some(w=>text.includes(w))) return 0;
    return 1;
  }
  function prepareTable(table){
    if(!table || table.dataset.v78109Prepared==='1' || isAdminView()) return;
    const rows=[...table.rows];
    if(rows.length<1) return;
    let header=rows.find(r=>r.querySelector('th'));
    const labels=header?[...header.cells].map(c=>(c.innerText||'Details').trim()):[];
    const body=table.tBodies[0]||table;
    let dataRows=[...body.rows].filter(r=>!r.querySelector('th'));
    if(!dataRows.length) return;

    table.classList.add('v78109-user-table');
    dataRows.forEach((row,index)=>{
      row.classList.add('v78109-user-row');
      row.dataset.v78109Original=String(index);
      [...row.cells].forEach((cell,i)=>cell.setAttribute('data-label',labels[i]||('Details '+(i+1))));
      if(rowPriority(row)===2) row.classList.add('v78109-priority-row');
    });

    // Pending/action-needed records first. Within each group, newest appended record first.
    dataRows.sort((a,b)=>{
      const pd=rowPriority(b)-rowPriority(a);
      if(pd) return pd;
      return Number(b.dataset.v78109Original)-Number(a.dataset.v78109Original);
    }).forEach(r=>body.appendChild(r));
    table.dataset.v78109Prepared='1';
  }
  function applyUserMobileLayout(){
    document.body.classList.toggle('admin-mobile-view',isAdminView());
    if(isAdminView()) return;
    document.querySelectorAll('section:not(#admin) table, .page:not(#admin) table').forEach(prepareTable);
  }
  let scheduled=false;
  function schedule(){
    if(scheduled)return; scheduled=true;
    requestAnimationFrame(()=>{scheduled=false;applyUserMobileLayout();});
  }
  document.addEventListener('DOMContentLoaded',schedule);
  window.addEventListener('resize',schedule);
  const observer=new MutationObserver(schedule);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(schedule,200);
  setTimeout(schedule,900);
})();
</script>
